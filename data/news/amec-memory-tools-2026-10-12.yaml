title: AMEC displays high-aspect-ratio etch and molybdenum ALD systems
summary: >-
  AMEC displayed its newly launched Primo XD-RIE etch system for 70-to-90:1 aspect ratios and its
  Prefima Unicore AM 300 mm molybdenum ALD system. China Star Market also reported more than 8,800
  cumulative AMEC reaction chambers operating in over 220 production lines by June 2026.
impact: >-
  The installed-base figure strengthens commercial-scale evidence, while the new tools target
  advanced-memory process steps. Neither the exhibition nor the reported fleet scale establishes
  named-customer qualification, accepted deliveries for the new tools, production nodes, utilization,
  uptime, yield contribution or operating economics.
