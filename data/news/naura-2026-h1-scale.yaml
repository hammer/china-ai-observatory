title: NAURA reports thousand-unit delivery scale in three semiconductor-equipment categories
summary: >-
  NAURA's half-year report says cumulative deliveries exceeded 1,000 units in each of etch,
  PVD and vertical furnace systems. It reported RMB 20.161 billion of first-half revenue and says
  hybrid-bonding and high-end TSV electroplating tools were rolled out.
impact: >-
  The delivery counts show breadth and commercial scale across several process steps relevant
  to domestic fabs and advanced packaging. They do not establish advanced-node qualification,
  customer yield, production volume for the new tools or domestic provenance of critical components.
