title: NAURA quarterly filing reiterates material-supply delivery pressure
summary: The unaudited September-quarter filing reports growing orders but pressure on some deliveries from
  tight material supply. Nine-month R&D investment reached RMB 5.427 billion; gross margin was 39.44%, versus
  41.41% a year earlier.
impact: Cash generation supports continued investment, but order growth does not establish completed deliveries
  or a replenishable domestic component supply chain. Customer-level acceptance and tool performance remain
  unquantified.
