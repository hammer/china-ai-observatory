title: Biren proposes a placement with estimated net proceeds of HK$4.02 billion
summary: >-
  Biren agreed a best-efforts placement of 130 million new H shares at HK$31.08 each, for gross
  proceeds of HK$4.0404 billion and estimated net proceeds of HK$4.0197 billion. It allocates 70%
  of net proceeds to strategic supply-chain procurement, production readiness and commercialization,
  20% to research, software and ecosystem development, and 10% to working capital.
impact: >-
  This is a conditional financing plan, not completed financing or production. Listing approval
  remained a prerequisite and the filing warned that the placement might not proceed. As of
  September 30, Biren had used HK$982.8 million, or 14%, of its prior July placement proceeds; the
  filing does not disclose suppliers, reserved capacity, counterparties or commercial commitments.
