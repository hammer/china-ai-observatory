title: Cambricon joins PyTorch Foundation governance as accelerator integration broadens
summary: The PyTorch Foundation says Cambricon joined as a Platinum member, gaining seats on
  its Governing Board and Technical Advisory Council. It reports Cambricon contributions across
  torch.compile, runtime, distributed computing and related areas. Huawei already holds Platinum
  membership and co-chairs the Foundation's Accelerator Integration Working Group.
impact: Upstream governance and device-agnostic integration work can reduce software-porting
  friction for non-NVIDIA accelerators. Membership and contribution scope do not establish
  performance, deployment scale or parity with CUDA.
