title: AMEC proposes further investment in advanced bonding-equipment supplier Qinghe Jingyuan
summary: >-
  AMEC's board approved up to RMB 35 million of additional investment in Qinghe Jingyuan as part
  of a RMB 250 million financing round. AMEC says the target develops wafer- and chip-bonding and
  surface-treatment equipment; the round is intended to support hybrid-bonding and atomic-beam
  equipment research, market development and customer delivery. AMEC's direct subsidiary would
  hold 7.0718% after the round, including its earlier investment.
impact: >-
  The proposal adds financing and strategic support for domestic advanced-packaging equipment,
  but the investment agreement had not been signed. The target's reported customer validation
  does not establish accepted production tools, qualified output, yield, throughput, reliability
  or domestic component provenance. The transaction is related-party because AMEC's chair is a
  Qinghe Jingyuan director.
