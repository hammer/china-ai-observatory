title: CXMT forecasts nine-month profit after year-earlier loss
summary: >-
  CXMT forecast January-September revenue of RMB 265.0-270.0 billion and attributable net profit
  of RMB 131.0-132.5 billion, compared with RMB 32.084 billion of revenue and a RMB 5.280 billion
  loss in the year-earlier period.
impact: >-
  The preliminary unaudited forecast is strong commercial-scale evidence. CXMT attributed the
  change to DRAM pricing, high utilization, higher output per wafer, scale and product-mix
  improvements, but did not disclose unit shipments, product-level revenue, yield, customer mix,
  HBM volume or domestic equipment and materials provenance.
