title: RoboTechnik launches Hong Kong offering to fund silicon-photonics equipment expansion
summary: >-
  RoboTechnik opened an offering of 11.876 million H shares. At the maximum price, its prospectus
  estimates HKD 4.961 billion of net proceeds and allocates 20% to product and technology R&D and
  40% to capacity and delivery expansion, including silicon-photonics assembly and test equipment.
impact: >-
  The financing could expand China's optical-interconnect manufacturing-equipment capacity, but the
  offer price and proceeds were not final when reviewed. The core ficonTEC operation and R&D network
  span Germany, Estonia, Ireland, the United States and China; Chinese ownership and growing Suzhou
  production therefore do not by themselves establish a fully domestic equipment supply chain.
