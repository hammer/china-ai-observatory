title: Eoptolink qualifies delayed shipments and material supply
summary: The company attributes September shipment delays to Thai flood logistics and says the affected
  revenue was recognized in October. It reports no production disruption or damaged goods. Material tightness
  extends beyond one component.
impact: This narrows the disruption to logistics rather than lost production. Expansion and NPO forecasts
  remain expectations, with no quantified qualified capacity or independent supply-chain verification.
