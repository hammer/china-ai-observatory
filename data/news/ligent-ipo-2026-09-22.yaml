title: Ligent raises HKD 5.67 billion for optical R&D and capacity
summary: >-
  Ligent Technologies completed its Hong Kong listing after raising HKD 5.67 billion. Reuters reports
  that about 52.9% of net proceeds are planned for faster optical products and chip R&D and 25.1% for
  production-capacity expansion. First-half revenue was RMB 5.39 billion and net profit RMB 661 million.
impact: >-
  The financing can expand China's optical-module and related chip capacity, but capital raised is not
  evidence of high-speed product qualification or domestic component provenance. Reuters cited an
  analyst saying the current shipment mix remains weighted toward the lower end of the module range.
