title: Biren's half-year summary reports revenue growth alongside continuing losses
summary: Biren's published infographic reports first-half 2026 revenue of RMB 1.236 billion,
  up 1,997.6% year on year, and a loss for the period of RMB 377 million. R&D expenditure
  was RMB 804 million. It also reports supplier qualification and batch deliveries to major
  internet customers without naming them in the infographic.
impact: More concrete commercialization evidence than a product announcement, but company-reported
  revenue does not establish customer utilization, domestic manufacturing provenance or benchmark parity.
