title: InnoLight reports optical sales growth alongside inventory expansion
summary: InnoLight reports nine-month revenue of RMB 69.547 billion and inventory of RMB 23.878 billion. Its
  unaudited filing attributes growth to high-speed optical demand and stockpiling for orders; fixed assets
  rose 75.91% with production-equipment investment.
impact: Sales and equipment investment support commercial expansion. Inventory is not shipped volume, and asset
  values do not disclose usable throughput, yield or domestic component independence.
