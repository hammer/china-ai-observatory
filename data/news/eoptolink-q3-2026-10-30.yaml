title: Eoptolink reports sales growth with higher inventory and lower operating cash flow
summary: Eoptolink reports nine-month revenue of RMB 31.850 billion, inventory of RMB 17.413 billion and operating
  cash flow of RMB 1.464 billion. The unaudited filing attributes the cash-flow decline to material payments
  and taxes; fixed assets rose 49.40% for capacity expansion.
impact: Commercial growth is accompanied by working-capital demands. Anticipated orders are not firm backlog;
  inventory and equipment investment do not establish shipped units, yield or a sovereign bill of materials.
