title: AMEC expands its process-tool portfolio with six CSEAC launches
summary: Science and Technology Daily reports six AMEC launches spanning very-high-aspect-ratio
  etch, PECVD, ALD, metal-film deposition and silicon-carbide epitaxy. Reported product claims
  include 70:1–90:1 etch aspect ratios and a PECVD system processing up to 16 wafers concurrently.
impact: The launches broaden AMEC beyond its core etch position into process steps relevant to
  advanced memory and logic. Announced specifications and portfolio breadth are not evidence of
  customer qualification, production yield, uptime or a sovereign end-to-end fab process.
