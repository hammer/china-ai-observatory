title: JCET proposes a RMB 6.5 billion private placement for packaging expansion
summary: >-
  JCET's board approved a proposal to raise up to RMB 6.5 billion. The planned uses include RMB
  1.5 billion for a high-performance-computing advanced-packaging expansion, RMB 1.0 billion for
  high-end power-module packaging and test, RMB 1.1 billion for wafer-level packaging, RMB 1.0
  billion for high-density, high-capacity memory-chip system-level packaging and test, and RMB 1.9
  billion for working capital and bank-debt repayment.
impact: >-
  The proposal identifies substantial capital intended for Chinese compute and memory packaging,
  but it is financing intent rather than completed funding or operating evidence. The issuance
  remains subject to state-asset, shareholder, Shanghai Stock Exchange and securities-regulator
  approvals or registration. The filing does not establish construction schedules, installed
  capacity, customer qualification, domestic equipment or material content, yield, throughput or
  realized output.
