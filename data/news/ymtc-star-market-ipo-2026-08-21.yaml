title: Exchange accepts YMTC's proposed RMB 33 billion STAR Market IPO
summary: >-
  The Shanghai Stock Exchange accepted Yangtze Memory Technologies Holding's STAR Market
  application with a stated financing amount of RMB 33 billion. The project record was subsequently
  marked as under inquiry.
impact: >-
  An accepted application is not completed financing, installed capacity, qualified output or
  evidence of a fully domestic equipment and materials flow. The offer price, valuation and final
  proceeds were not set in the exchange project record reviewed.
