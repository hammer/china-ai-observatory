title: Huawei updates its 2027 accelerator roadmap and reports supernode shipments
summary: >-
  Huawei said the 960DT is planned for the first quarter of 2027 and the Ascend 960PR for the
  third quarter. It also said it had shipped more than 1,000 supernodes to more than 370 customers.
impact: >-
  The shipment claim is evidence of company-reported system scale, not independent operational
  performance. Huawei did not identify customers, disclose chips per shipped system or provide
  acceptance, utilization, workload, power, reliability or interconnect-performance data. The
  2027 launch dates are expected milestones and do not establish delivery.
