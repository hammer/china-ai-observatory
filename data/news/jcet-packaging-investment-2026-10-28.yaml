title: JCET raises investment plan with advanced-packaging focus
summary: At its October 27 briefing, JCET said nine-month fixed capital expenditure was nearly RMB 8.9
  billion. Its 2026 investment plan rises from RMB 11.01 billion to RMB 18.2 billion, including fixed-asset
  investment of RMB 17.31 billion; incremental spending mainly targets advanced-packaging lines.
impact: Management says new capacity is beginning to contribute, but gives no package-level capacity,
  acceptance, yield or domestic-input breakdown. Planned expenditure is distinct from completed equipment
  installation and qualified output; the September financing proposal remains historical context.
