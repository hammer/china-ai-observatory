title: Kingsemi reports order growth and production pressure
summary: >-
  At its half-year results briefing, Kingsemi management said new orders had grown markedly and
  production was under pressure, prompting an orderly capacity expansion. It targets faster progress
  in front-end track equipment during 2026 and 2027 and further customer introduction of front-end
  chemical-cleaning products. Front-end revenue was roughly level with its traditional back-end
  advanced-packaging business in the first half, and cleaning equipment exceeded 30% of revenue.
impact: >-
  The comments support demand and product-mix progress, but the company did not quantify orders,
  capacity, output, accepted tools, fab nodes, throughput, defect rates or customer qualification.
  The report also says a previously funded expansion project remains delayed, with only the main
  factory structure topped out, so management's capacity plan is not evidence of completed output.
