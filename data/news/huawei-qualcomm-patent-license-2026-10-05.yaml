title: Huawei and Qualcomm agree a broad patent cross-license
summary: >-
  Huawei and Qualcomm announced a multi-year cross-license spanning patent portfolios in 5G,
  compute, AI and networking. Qualcomm also agreed to purchase certain Huawei US patents in
  compute, AI, networking and other fields, subject to regulatory approvals.
impact: >-
  The agreement shows bidirectional participation in global technology IP rather than complete
  isolation, while the patent sale also demonstrates Huawei's exportable portfolio. It does not
  identify the patents, financial terms or product implementations and is not a chip-supply or
  manufacturing agreement; it therefore cannot establish that Ascend hardware depends on named
  Qualcomm technology or that Huawei has removed external IP dependencies.
