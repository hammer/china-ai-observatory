title: Optical suppliers disclose order horizon and 1.6T shipment ramp
summary: In October 23 filings, InnoLight reports major overseas customer orders through 2027 and separate
  2028 demand guidance; Eoptolink reports continuing 1.6T volume growth. InnoLight also reports next-generation
  co-development and sampling without identifying the products or customers.
impact: These primary filings add company-attributed commercial detail beyond the October 22 operating
  reassurances. They do not quantify shipment volumes or yields, establish future deliveries, or resolve
  foreign-component dependencies.
