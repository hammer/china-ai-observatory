title: Kingsemi reports rising delivery revenue but continuing losses and cash outflow
summary: Kingsemi reports nine-month revenue of RMB 1.334 billion, attributable net loss of RMB 55.0 million
  and operating cash outflow of RMB 446.7 million. Its unaudited filing links sales growth to advancing deliveries
  and acceptance, while higher costs and lower government grants weigh on profits.
impact: Financial evidence strengthens the commercial-delivery record but does not independently verify advanced-node
  qualification, tool-level economics or fab performance.
