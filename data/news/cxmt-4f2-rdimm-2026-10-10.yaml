title: CXMT targets a 4F2 server DDR5 RDIMM by year-end 2026
summary: >-
  CXMT president Cao Kanyu described a self-developed vertical-surrounding-gate transistor and
  related process work for a denser 4F2 DRAM cell architecture. The company said its first intended
  product is a server DDR5 RDIMM expected by year-end 2026.
impact: >-
  This is a consequential cell-architecture and server-memory roadmap, not a completed production
  milestone. CXMT did not disclose speed, capacity, process node, customer qualification, production
  volume or independent validation, and a target date is not evidence that the product has launched.
