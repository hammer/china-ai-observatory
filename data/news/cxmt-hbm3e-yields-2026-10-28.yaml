title: CXMT reportedly targets limited HBM3E production with low yields
summary: Reuters sources report HBM3E samples sent to domestic chip designers, with limited production
  expected within two months and estimated yields of 20-30%. CXMT did not comment; qualified shipment
  volume remains unverified.
impact: The earlier August small-volume report is preserved. This later plan does not establish a completed
  commercial ramp, competitive cost or a replenishable domestic production flow; the yield estimate is
  not an independent measurement.
