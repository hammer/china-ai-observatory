title: AMEC etch tools reportedly evaluated at foreign-owned memory fabs in China
summary: >-
  Reuters reported that Samsung and SK Hynix had been evaluating AMEC etch equipment for possible
  use at their Chinese factories as a contingency against tighter US controls. Both companies denied
  testing AMEC tools for use in China, and the reported evaluations had not produced a wider-deployment decision.
impact: >-
  Evaluation by leading memory manufacturers would be a meaningful route toward external qualification,
  but disputed testing and the absence of a deployment decision do not establish customer acceptance,
  production use, yield, uptime, service readiness or adoption outside China.
