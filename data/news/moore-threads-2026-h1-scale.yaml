title: Moore Threads reports first-half revenue scale and a delivered KUAE cluster contract
summary: >-
  Moore Threads' half-year report says revenue reached RMB 1.736 billion, up 147.42% year over
  year, while attributable net loss narrowed to RMB 11.56 million. It says a RMB 660 million KUAE
  cluster sales contract was fully delivered and recognized as revenue.
impact: >-
  The delivered contract is stronger commercialization evidence than a roadmap announcement.
  It remains company-reported and does not disclose the customer, accepted card count, topology,
  workload results, power, uptime or production economics.
