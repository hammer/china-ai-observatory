title: Cambricon clarifies shipment rumour and inventory risk
summary: Management said it never communicated the million-chip shipment figure and gave no SiYuan 690 delivery
  timetable. It said procurement combines orders with demand forecasts and reported RMB 501.6129 million of
  inventory write-down provisions for January-September.
impact: Inventory growth is not a verified shipment forecast or proof of secured HBM supply. This adds clarification
  without revising the earlier financial report.
