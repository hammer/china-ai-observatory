title: China pairs stronger AI supply support with anti-bubble controls
summary: >-
  The Communist Party of China Central Committee and State Council called for faster artificial
  intelligence theory and core-technology development, stronger compute, algorithm and data supply,
  a national integrated computing-power network, and broader AI adoption in industries and devices.
  The guidance also requires locally appropriate planning, warns against herd-like competition,
  industrial bubbles and blind investment, and calls for accountability when such investment causes
  major losses.
impact: >-
  National support for AI infrastructure and adoption remains explicit, while the anti-duplication
  and accountability language could constrain undifferentiated local projects and subsidy-driven
  expansion. The document sets policy direction; it does not provide a quantified budget,
  implementation schedule, procurement award, company allocation or evidence that any tracked
  supplier has benefited.
