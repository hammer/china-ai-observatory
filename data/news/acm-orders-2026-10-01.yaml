title: ACM Research Shanghai reports RMB 17.073 billion backlog
summary: ACM Research Shanghai reported RMB 17.073 billion of orders on hand, up 88.2% year over year.
impact: >-
  The aggregate is a meaningful demand and scale signal for a domestic process-equipment supplier,
  but it is unaudited and combines future deliveries with equipment already delivered but not yet
  recognized as revenue. The filing gives no customer, product, fab, qualification, acceptance,
  cancellation or domestic-content split, and warns that orders may be delayed or terminated.
