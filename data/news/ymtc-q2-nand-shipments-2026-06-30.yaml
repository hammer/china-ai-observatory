title: Counterpoint ranks YMTC third by second-quarter NAND shipment volume
summary: >-
  Counterpoint Research estimated that YMTC held 14% of global NAND shipment volume in the second
  quarter of 2026, behind Samsung at 25% and SK hynix at 22%. It said YMTC shipment volume grew 22%
  year over year and 5% quarter over quarter.
impact: >-
  This is independent evidence of commercial scale, not revenue or enterprise-storage leadership.
  Counterpoint ranked YMTC fifth by revenue and said its mix remained concentrated in lower-priced
  consumer applications, with a low share of data-center enterprise SSDs. The estimates do not
  establish production yield, capacity, customer qualification or domestic equipment provenance.
