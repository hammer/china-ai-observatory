title: CXMT says its fifth-generation DRAM platform and 24 Gb LPDDR5X entered mass production
summary: >-
  At the 2026 World Manufacturing Convention, CXMT said its fifth-generation DRAM platform had
  entered mass production using quadruple patterning and an 11.95 nm active-area half-pitch. The
  company also said two 24 Gb LPDDR5X products made on the platform were in mass production.
impact: >-
  This is a material claimed density and manufacturing milestone for China's commodity DRAM base,
  but not an HBM milestone or an independent yield result. CXMT's claim of at least 50% more gross
  dies per wafer than its fourth-generation platform measures potential dies before defects are
  excluded. The company said it worked with Chinese equipment makers on critical steps without
  naming them or establishing a fully domestic process flow.
