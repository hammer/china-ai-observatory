title: NAURA signs RMB 404.6 million hybrid-bonding equipment acquisition
summary: >-
  NAURA's wholly owned NAURA Microelectronics subsidiary signed an agreement to acquire 100% of
  Nuohe Jianwei for RMB 404.6 million. The target develops hybrid-bonding equipment for advanced
  packaging and was described as being in product validation and market introduction.
impact: >-
  The transaction could broaden NAURA's advanced-packaging portfolio after closing, but the signed
  agreement remained subject to closing conditions. Reported shipments and repeat orders do not
  establish named-customer acceptance, production use, throughput, yield, uptime or domestic
  component provenance.
