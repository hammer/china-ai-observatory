title: MetaX forecasts nine-month profit after year-earlier loss
summary: >-
  MetaX forecast January-September revenue of RMB 2.541-3.106 billion and net profit attributable
  to shareholders of RMB 586.8-717.2 million, compared with a RMB 345.5 million loss in the
  year-earlier period. It forecast adjusted net profit of RMB 223.2-302.0 million.
impact: >-
  The forecast strengthens commercial-scale evidence but was unaudited and said increased
  investment in supply-chain companies also contributed to the profit change. It did not disclose
  customer names, unit volumes, workloads, utilization, fabrication, memory provenance or matched
  accelerator performance.
