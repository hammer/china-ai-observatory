title: Hwatsing completes a RMB 3.795 billion private placement
summary: >-
  Hwatsing said it completed a private placement of 16,080,508 A shares at RMB 236 per share,
  raising RMB 3.795 billion before expenses. The company says proceeds will fund a Shanghai
  semiconductor-equipment R&D and manufacturing base, Kunshan wafer-reclaim expansion and
  high-end semiconductor-equipment R&D.
impact: >-
  The financing materially increases resources available for Chinese CMP, wafer-processing and
  adjacent equipment capacity and development. It is not evidence that the funded projects are
  complete or that new tools have passed customer qualification: construction schedules,
  installed capacity, tool mix, domestic-component content, yield, uptime and realized output
  were not disclosed in the completion announcement.
