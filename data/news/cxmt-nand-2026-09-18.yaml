title: CXMT reportedly prepares to enter NAND with a Beijing R&D production line
summary: >-
  Reuters reports that CXMT plans a NAND flash R&D production line at its new Beijing plant and
  has discussed prospective AI-system storage customers, extending beyond its core DRAM business.
impact: >-
  The plan would broaden China's domestic memory base and put CXMT into YMTC's main market, but it
  is not commercial-production evidence. Reuters could not establish when the line would operate
  or whether CXMT would proceed beyond research and trial production; CXMT did not comment.
