title: CXMT proposes funding DRAM research and back-end testing projects
summary: >-
  CXMT's board approved a proposal to use RMB 13.0 billion of over-raised IPO funds toward a
  RMB 24.1 billion technology-research project and RMB 5.0 billion toward a RMB 10.8 billion
  second-phase DRAM wafer back-end testing base in Hefei. The filing says the testing project is
  intended to address possible external testing-capacity constraints as wafer output and product
  variety increase.
impact: >-
  The RMB 18.0 billion proposed allocation is a consequential financing and vertical-integration
  signal, but it remained subject to shareholder approval and does not establish completed
  construction, installed test capacity, qualified output, yield, utilization or operating cost.
  The filing concerns DRAM research and testing generally and does not establish HBM volume,
  stack yield or a fully domestic equipment and materials flow.
