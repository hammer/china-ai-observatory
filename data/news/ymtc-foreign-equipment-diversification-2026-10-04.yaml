title: Reporting finds YMTC diversified to Dutch and Japanese fab equipment
summary: >-
  The Wire China reported that after U.S. export controls cut YMTC off from critical American
  chipmaking tools, the company bought equipment from Dutch and Japanese suppliers. The report also
  said that at least one YMTC innovation was subsequently licensed to Samsung.
impact: >-
  The account is evidence of supply-chain resilience and Chinese memory-process IP, but not a fully
  domestic production flow. It does not identify the equipment suppliers or models, quantify the
  domestic-versus-foreign tool share, establish replenishment under tighter controls, or disclose
  the licensed patent, commercial terms, production use, yield or volume.
