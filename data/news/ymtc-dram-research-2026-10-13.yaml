title: Counterpoint reports YMTC DRAM research and testing without mass production
summary: >-
  Counterpoint reported that YMTC was conducting R&D and testing of a second-generation 16 Gb
  LPDDR5 device at roughly 5,000 wafers per month and had no plan to mass-produce that device. It
  described a faster 9,600 MT/s version as a development target for Fab 3.
impact: >-
  This is evidence of DRAM process learning rather than qualified commercial output. It does not
  establish yield, customer acceptance, HBM capability, equipment provenance or a production date.
  Counterpoint also described a current 16.5% NAND shipment share, but did not publicly reconcile
  its measurement basis with its earlier 14% second-quarter estimate.
