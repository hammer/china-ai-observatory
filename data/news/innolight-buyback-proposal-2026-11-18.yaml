title: InnoLight chairman proposes RMB 2–4 billion buyback
summary: The chairman proposed a RMB 2–4 billion repurchase using own or raised funds, within twelve months
  after board approval. The filing reiterates normal operations, stable supply and strong orders.
impact: Approval and implementation remain uncertain. This is proposed capital allocation, not funding for
  added industrial capacity; the operating assurances include no utilization percentage, shipment count or
  yield measurement.
