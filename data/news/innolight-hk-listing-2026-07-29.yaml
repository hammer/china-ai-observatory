title: Innolight prices Hong Kong offering for HKD 52.9 billion net proceeds
summary: >-
  Innolight's final allotment announcement set a HKD 980 offer price for 54.5 million shares and
  estimated HKD 52.891 billion of net proceeds before any over-allotment exercise. Trading was due
  to begin July 30.
impact: >-
  The unusually large financing demonstrates market access and can fund expansion, but it does not
  by itself establish domestic provenance for optical DSPs, lasers or other critical components,
  nor production yield or customer qualification at 1.6T.
