title: Reporting says YMTC raised chip prices and shifted production mix
summary: >-
  The Wire China reportedly quoted an unnamed YMTC employee saying the company had raised
  memory-chip prices, shifted production toward higher-margin products and expected the global
  memory shortage to last at least another three years.
impact: >-
  This is a market-strength and allocation signal, not company guidance or proof of added sovereign
  capacity. The account does not disclose affected products, price changes, capacity reallocation,
  customer contracts or whether the forecast refers specifically to NAND rather than memory broadly.
