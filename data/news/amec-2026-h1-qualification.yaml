title: AMEC reports production deployment and repeat orders across etch and tungsten deposition
summary: >-
  AMEC's half-year report says three ICP etch product families were in volume production
  on lines at more than 50 customers. It also reports stable production use of its LUX-Cryo etcher,
  multiple repeat orders for another advanced etcher, and onsite validation plus repeat production
  orders for tungsten deposition systems at key memory and logic customers.
impact: >-
  This is stronger commercial evidence than a product launch because it includes production-line,
  validation and repeat-order claims. It remains company-reported: customers, process nodes, yield,
  uptime, throughput, installed capacity and revenue by tool were not disclosed.
