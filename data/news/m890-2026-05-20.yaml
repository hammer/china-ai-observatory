title: Alibaba announces Zhenwu M890
summary: >-
  Alibaba announced the Zhenwu M890 and Panjiu AL128 rack system. T-Head said it had shipped more
  than 560,000 Zhenwu units and that more than 400 external customers across 20 industries had
  deployed the chips; the disclosure did not break out product generations or operating metrics.
impact: >-
  The shipment and customer counts are evidence of reported deployment scale, not independent
  workload performance or sovereign supply. Watch measured utilization and economics rather than
  undisclosed vendor multipliers.
