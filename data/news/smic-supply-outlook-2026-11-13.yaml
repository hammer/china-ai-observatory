title: SMIC reports longer equipment deliveries and forecasts continued supply pressure
summary: Management cited 16–24-month equipment lead times and potential capital-spending
  disruption, while retaining its 2026 expansion plan. It forecast tight wafer supply
  in 2027 and AI-memory balance around mid-to-late 2028, with compute/supporting chips
  still constrained.
impact: This is an attributed supply outlook, not measured future capacity, tool
  acceptance or advanced-node yield. Previously dated Observatory forecasts remain unchanged.
