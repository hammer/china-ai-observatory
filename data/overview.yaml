thesis: Useful domestic AI compute is advancing faster than full supply-chain independence.
description: Inference and networking lead. HBM and production equipment constrain scale.
as_of: 2026-09-11
sovereignty:
  - title: Chinese design
    body: Who designs and controls the chip architecture and software?
  - title: Domestic fabrication
    body: Where are the compute dies, memory, and packages manufactured?
  - title: Replenishable supply chain
    body: Can production expand without foreign tools, components, materials, or replacement parts?
forecasts:
  - area: Optical networking
    horizon: Now–2028
    view: An existing global strength, with continued foreign-component dependencies.
    confidence: High
    source_ids:
      - innolight
      - eop-dsp
  - area: Focused inference
    horizon: 2026–2029
    view: Substantial domestic substitution and selective cost/performance wins on established workloads.
    confidence: High domestically; medium globally
    source_ids: []
  - area: Large accelerator systems
    horizon: 2027–2030
    view: More competitive aggregate capability, often with higher hardware and power requirements.
    confidence: Medium
    source_ids:
      - cloudmatrix
  - area: HBM and advanced packaging
    horizon: 2027–2030
    view: Useful domestic volume can improve before parity with the fastest contemporary memory.
    confidence: Medium
    source_ids: []
  - area: Frontier pretraining
    horizon: Late 2020s
    view: Viable domestic training expands, while efficiency, software flexibility and reliability remain
      disadvantages.
    confidence: Medium
    source_ids: []
  - area: EUV and frontier fabrication
    horizon: Into the 2030s
    view: First successful chips can precede commercially competitive manufacturing by years.
    confidence: High on direction; low on dates
    source_ids: []
change_mind:
  - Customer-qualified domestic HBM at scale
  - Domestic scanners publishing sustained yield, overlay, throughput, and uptime
  - Independent large-cluster training results with time-to-quality and energy use
