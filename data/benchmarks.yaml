headline: No verified latest-versus-latest independent comparison
assessment: Follow-up through September 23 did not verify a matched independent comparison of
  current Chinese accelerators against Rubin, GB300, MI355X, TPU v7, or OpenAI Jalapeño. The review checked MLPerf v6.0
  repository heads and submitter listings plus InferenceX's published coverage, not every result artifact.
  A Pengcheng Laboratory preprint adds measured Ascend 910C scientific-computing results against
  A800/H800 controls, but it is not a model-training or inference comparison and does not use current
  frontier foreign hardware. Absence of a verified public result is not evidence of incapability.
reviewed_at: 2026-09-23
comparison:
  title: DeepSeek-R1 on Ascend 910C and H100
  date: 2025-06
  evidence: vendor
  source_ids:
    - cloudmatrix
  rows:
    - metric: Prefill tokens/s per accelerator
      china: 5,655
      outside: 6,288
    - metric: Decode tokens/s per accelerator
      china: 1,943
      outside: 2,172
    - metric: Decode time per output token
      china: 49.4 ms
      outside: 55.6 ms
  caveats: Vendor/partner measurements versus published NVIDIA baselines. INT8 versus FP8, different decode
    batches, and speculative-decoding assumptions prevent a universal ratio. Perfect expert-balancing results
    are projections.
studies:
  - title: Ascend 910 scientific-computing study
    evidence: measured
    date: "2026-07-22"
    finding: Pengcheng Laboratory measured Ascend 910A/B/C across scientific kernels and five
      applications. In one matched quantum-simulation case, a tuned 910C implementation completed
      a 30-qubit, 30-layer circuit in 11.4 seconds versus 14.3 seconds on A800 with cuQuantum. The
      study also reports weaker vector and memory-bound behavior, relies on workload-specific
      optimization, compares against export-limited A800/H800 rather than current frontier chips,
      and does not establish AI model-training or inference parity.
    source_ids:
      - ascend-science-2026-07-22
  - title: Biren GLM-5.3-Flash functional validation
    evidence: vendor
    date: "2026-09-07"
    finding: Vendor reports functional and accuracy checks on Bili 166M with SGLang and BIRENSUPA.
      Compatibility evidence only; no matched foreign-hardware throughput, latency or power comparison.
    source_ids:
      - biren-glm-2026-09-07
  - title: MLPerf Training / Inference v6.0
    evidence: standardized
    date: "2026"
    finding: Standardized submitter-run results; no matched latest Chinese-versus-foreign comparison established
      in this baseline.
    source_ids:
      - mlperf-training
      - mlperf-inference
  - title: InferenceX
    evidence: measured
    date: Continuous
    finding: Reproducible independent inference runs. The current dashboard names Rubin, GB300,
      MI355X, TPU v7 and OpenAI Jalapeño systems; equivalent current Chinese results were not verified.
    source_ids:
      - inferencex
  - title: Ascend operational field study
    evidence: measured
    date: 2026-07
    finding: A small independent preprint documents deployment friction on older Ascend 910 devices. No matched
      NVIDIA control.
    source_ids:
      - ascend-field
  - title: HiFloat4 pretraining
    evidence: vendor
    date: 2026-04
    finding: Demonstrates training progress on dense and MoE models; does not measure frontier time-to-quality
      against foreign hardware.
    source_ids:
      - hifloat4
