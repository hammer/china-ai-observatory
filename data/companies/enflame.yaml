name: Enflame
chinese_name: 燧原科技
counterparts:
  - NVIDIA
  - AMD
priority: 1
stage: Scaling
role: AI accelerators and systems with Tencent as an anchor customer.
assessment: TechInsights found TSMC N6 in the examined S60 compute chiplet; this does not identify the
  provenance of every later product. Enflame displayed an ESL64-0 supernode with an orthogonal,
  cable-free electrical interconnect and optical scale-out, but supplied no card count, operating
  deployment, workload, reliability, power or matched performance result.
key_fact:
  label: Customer concentration
  value: 83.79% of 2025 revenue linked to Tencent
  evidence: reported
  as_of: 2026-09-11
  source_ids:
    - enflame-ipo
    - enflame-teardown
facts:
  - label: ESL64-0 supernode
    value: Enflame displayed an ESL64-0 supernode using its own AI accelerators, an OEX orthogonal
      electrical interconnect, a cable-free internal design and optical scale-out. The exhibition
      report did not establish an operating deployment, card count, topology, workload performance,
      utilization, reliability or power.
    evidence: reported
    as_of: 2026-10-12
    source_ids:
      - guoxin-expo-2026-10-12
  - label: IPO-funded development plans
    value: Reuters reports IPO proceeds are intended mainly for fifth- and sixth-generation
      AI chips, software and large computing systems; funding plans are not delivered products.
    evidence: reported
    as_of: 2026-09-11
    source_ids:
      - enflame-ipo
  - label: S60 compute chiplet
    value: TSMC N6, identified by independent teardown
    evidence: measured
    as_of: 2026-02-03
    source_ids:
      - enflame-teardown
