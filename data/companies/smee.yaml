facts:
- label: Dry-lithography product scope
  value: The undated official listings specify SSB800 I-line for 280 nm and above and SSC800 KrF for 110
    nm and above. These product scopes do not establish advanced immersion or EUV qualification.
  evidence: vendor
  as_of: '2026-11-10'
  source_ids:
  - smee-ssb800
  - smee-ssc800
- label: Attributed dry-tool operating claims
  value: November 9 CIIE reporting quotes SMEE claiming over 90% domestic content in key components, more
    than 10 million cumulative wafer passes supported, and effective operating rate above 92%. The exhibit
    comprised platform models. Customer identities, installed-tool count, measurement period, uptime methodology
    and component-content denominator are undisclosed; repeated wafer processing must not be read as unique
    good wafers or independent performance validation.
  evidence: vendor
  as_of: '2026-11-09'
  source_ids:
  - smee-ciie-2026-11-09
