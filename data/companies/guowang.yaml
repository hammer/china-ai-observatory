facts:
  - label: Yizhuang facility renovation procurement
    value: A November 2 government notice discloses qualified applicants for Building 3 renovation. The
      August 18 tender specifies 11,610.69 square metres, an estimated RMB 76.9104 million contract
      and a planned 176-day construction period. These are procurement-stage premises works, not
      evidence of a contract award, completed facility, qualified projection optics or production
      throughput.
    evidence: primary
    as_of: 2026-11-02
    source_ids:
      - guowang-renovation-tender-2026-08-18
      - guowang-renovation-applicants-2026-11-02
  - label: Optical manufacturing recruitment
    value: An October 16 Hebei University notice recruits 2027 graduates for optical coating, processing
      and inspection, optical-mechanical integration, and system testing. It supports continuing staffing
      activity but identifies no qualified projection-optics product, delivered unit, customer acceptance
      or production yield.
    evidence: primary
    as_of: '2026-10-16'
    source_ids:
    - guowang-recruitment-2026-10-16
