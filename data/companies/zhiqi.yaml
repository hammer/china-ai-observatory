facts:
  - label: 2025 optical-component operations
    value: Fujing reported Zhiqi revenue of RMB 167 million, up 119.81%, and net profit of
      RMB 40.0586 million for 2025. Its products include precision lenses, prisms and
      super-smooth mirrors; this does not establish scanner projection-lens qualification.
    evidence: primary
    as_of: 2025-12-31
    source_ids:
      - zhiqi-fujing-ir-2026-05-29
  - label: Parent-company operating update
    value: Fujing Technology said Zhiqi grew quickly in the first half of 2026 and expected full-year
      development to remain on plan; it did not disclose revenue, customers, lithography qualification,
      optics specifications, yield or production volume.
    evidence: primary
    as_of: 2026-09-01
    source_ids:
