facts:
  - label: Reported order and capacity pressure
    value: Management said new orders grew markedly and production was under pressure, prompting
      capacity expansion; it targets faster front-end track progress in 2026-2027 and further customer
      introduction of cleaning tools. No order, capacity, accepted-tool or qualification counts were disclosed.
    evidence: reported
    as_of: 2026-10-09
    source_ids:
      - kingsemi-capacity-2026-10-10
  - label: First-half product mix
    value: Front-end revenue was reported roughly level with back-end advanced-packaging revenue and
      cleaning equipment exceeded 30% of revenue; revenue mix does not establish advanced-node qualification.
    evidence: reported
    as_of: 2026-06-30
    source_ids:
      - kingsemi-capacity-2026-10-10
  - label: Nine-month delivery revenue and operating losses
    value: The unaudited filing reports nine-month revenue of RMB 1.334 billion, up 34.73%, attributable net
      loss of RMB 55.0 million and operating cash outflow of RMB 446.7 million. Management links revenue growth
      to orders, deliveries and acceptance; higher personnel and procurement payments reduced cash flow. Accepted-tool
      counts, process nodes, throughput and defect rates remain undisclosed.
    evidence: vendor
    as_of: '2026-09-30'
    source_ids:
    - kingsemi-q3-2026-10-30
