name: JCET
chinese_name: 长电科技
counterparts:
  - ASE
  - Amkor
  - TSMC CoWoS
priority: 2
stage: Commercial
role: Outsourced assembly, test, and advanced packaging.
assessment: JCET's half-year report provides company evidence of XDFOI volume production and
  customer validation of silicon-photonics engine samples. Its September private-placement plan
  would direct RMB 1.5 billion to a high-performance-computing advanced-packaging expansion, but
  the financing and projects remain conditional. The record does not establish frontier
  compute-plus-HBM package yield, installed capacity, thermal performance or domestic input
  provenance.
key_fact:
  label: XDFOI production status
  value: Company reports that its high-density heterogeneous-integration platform reached volume production
  evidence: vendor
  as_of: 2026-06-30
  source_ids:
    - jcet-2026-h1-report
facts:
  - label: Advanced-packaging investment expansion
    value: At its October 27 briefing, JCET said nine-month fixed capital expenditure was nearly RMB 8.9
      billion. Its 2026 investment plan rises from RMB 11.01 billion to RMB 18.2 billion, including fixed-asset
      investment of RMB 17.31 billion; incremental spending mainly targets advanced-packaging lines.
    evidence: reported
    as_of: '2026-10-27'
    source_ids:
    - jcet-packaging-investment-2026-10-28
  - label: Computing-electronics mix
    value: First-half computing-electronics revenue grew 40.4% year over year and represented 30.1%
      of company revenue.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - jcet-2026-h1-report
  - label: Silicon-photonics validation
    value: Company reports delivering XDFOI-based silicon-photonics engine samples that passed
      customer validation and working with multiple customers on packaging, thermal and reliability
      optimization; volume and capacity were not disclosed.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - jcet-2026-h1-report
  - label: Planned packaging-capacity financing
    value: >-
      JCET proposes raising up to RMB 6.5 billion, including RMB 1.5 billion for a
      high-performance-computing advanced-packaging expansion and RMB 1.0 billion for a
      high-density, high-capacity memory-chip system-level packaging and test upgrade. The
      offering and projects remain subject to approvals and completion.
    evidence: primary
    as_of: 2026-09-03
    source_ids:
      - jcet-private-placement-plan-2026-09-04
watch_for:
  - Large compute-plus-HBM package yield
  - Capacity, thermal limits and reliability
