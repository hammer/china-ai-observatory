priority: 2
stage: Commercial
role: Optical transceivers, optical chips and network terminals for data-center and telecom links.
assessment: Ligent combines optical modules with some chip and terminal development and has raised
  substantial capital for faster products and capacity. Reuters reported an analyst's view that its
  current shipments remain weighted toward lower-speed modules; high-speed shipment mix, customer
  qualification, manufacturing yield and critical component provenance remain undisclosed.
key_fact:
  label: IPO capital for R&D and capacity
  value: Raised HKD 5.67 billion; plans about 52.9% of net proceeds for product and chip R&D and 25.1% for capacity expansion
  evidence: reported
  as_of: 2026-09-22
