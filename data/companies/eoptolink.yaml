name: Eoptolink
chinese_name: 新易盛
counterparts:
  - Coherent
priority: 1
stage: Commercial
role: High-speed optical transceivers and network optics.
assessment: A clear example of global Chinese product competitiveness without total component sovereignty.
  A September 2026 independent teardown of one 400G module identified US DSP and analog/power
  components, but the anonymous single-sample inspection does not establish the bill of materials
  for current 800G or 1.6T production. A proposed US procurement restriction now names Eoptolink,
  adding policy risk without yet creating an enacted or general commercial ban.
key_fact:
  label: Component provenance
  value: 1.6T designs use Broadcom optical DSPs
  evidence: vendor
  as_of: 2026-03-11
  source_ids:
    - eop-dsp
    - eoptolink
facts:
  - label: 1.6T shipment progression
    value: Company reports higher second-quarter than first-quarter 2026 shipments;
      faster second-half growth is an expectation, not a realized result.
    evidence: reported
    as_of: 2026-09-11
    source_ids:
      - cioe-optics-2026-09-11
  - label: 400G module component inspection
    value: An independent teardown of one Eoptolink 400G DR4+2km module identified a Marvell
      IN010C50 DSP and multiple Analog Devices power and analog parts; the module's manufacturing
      date and representativeness were not established.
    evidence: measured
    as_of: 2026-09-19
    source_ids:
      - eoptolink-400g-teardown-2026-09-19
  - label: Proposed US procurement restriction
    value: A bipartisan Senate bill introduced on September 25 would prohibit federal procurement
      of covered Eoptolink optical transceivers for national-security systems after a five-year
      transition, with limited waivers. It is proposed legislation, not a current or market-wide ban.
    evidence: primary
    as_of: 2026-09-25
    source_ids:
      - us-optical-transceiver-bill-primary-2026-09-25
      - us-optical-transceiver-bill-reuters-2026-09-25
watch_for:
