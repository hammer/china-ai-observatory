name: InnoLight
chinese_name: 中际旭创
counterparts:
  - Coherent
priority: 1
stage: Commercial
role: Optical modules for global data-center networks.
assessment: Module-level competitiveness can coexist with foreign-component dependencies. A proposed
  US procurement restriction now names InnoLight, adding policy risk without yet creating an enacted
  or general commercial ban.
key_fact:
  label: Strategic position
  value: Globally competitive optical-module supplier
  evidence: vendor
  as_of: 2026-09-11
  source_ids:
    - innolight
facts:
  - label: Hong Kong financing
    value: The July 2026 global offering priced at HKD 980 per share with estimated net proceeds of
      HKD 52.891 billion before any over-allotment exercise.
    evidence: primary
    as_of: 2026-07-29
    source_ids:
      - innolight-hk-listing-2026-07-29
  - label: 1.6T commercialization
    value: Company says silicon-photonics modules are scaling with shipments rising each quarter,
      according to National Business Daily's September 11 reporting.
    evidence: reported
    as_of: 2026-09-11
    source_ids:
      - cioe-optics-2026-09-11
  - label: Proposed US procurement restriction
    value: A bipartisan Senate bill introduced on September 25 would prohibit federal procurement
      of covered InnoLight optical transceivers for national-security systems after a five-year
      transition, with limited waivers. It is proposed legislation, not a current or market-wide ban.
    evidence: primary
    as_of: 2026-09-25
    source_ids:
      - us-optical-transceiver-bill-primary-2026-09-25
      - us-optical-transceiver-bill-reuters-2026-09-25
watch_for:
  - 1.6T product shipments and customer qualification
  - DSP and laser sourcing
  - Performance per watt and manufacturing yield
