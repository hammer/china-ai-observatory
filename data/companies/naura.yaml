role: Broad etch, deposition, thermal, and other semiconductor equipment.
assessment: NAURA reports broad commercial scale and more than 1,000 cumulative deliveries in each
  of three tool categories. Delivery counts do not establish advanced-node customer qualification,
  production yield or domestic provenance for critical components, and a qualified tool still covers
  only one process step rather than a sovereign fab flow.
