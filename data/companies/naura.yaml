name: NAURA
chinese_name: 北方华创
counterparts:
  - Applied Materials
  - Lam Research
priority: 1
stage: Commercial
role: Broad etch, deposition, thermal, and other semiconductor equipment.
assessment: NAURA reports broad commercial scale and more than 1,000 cumulative deliveries in each
  of three tool categories, and says its atomic-layer-etch tool has achieved customer process use.
  Its signed acquisition of a hybrid-bonding equipment developer would broaden its advanced-packaging
  portfolio after closing. Delivery counts, product validation and a signed transaction do not establish
  advanced-node volume production, yield, uptime or domestic provenance for critical components. The
  company's warning that supplier-material tightness may delay some orders also shows that qualified
  tools do not by themselves establish a sovereign fab flow.
key_fact:
  label: Deployment scale
  value: Company reports more than 1,000 cumulative deliveries each for etch, PVD and vertical furnace systems
  evidence: vendor
  as_of: 2026-06-30
  source_ids:
    - naura-2026-h1-report
facts:
  - label: Hybrid-bonding acquisition agreement
    value: NAURA Microelectronics signed an agreement to acquire 100% of Nuohe Jianwei for RMB 404.6
      million. The target's hybrid-bonding systems were described as being in product validation and
      market introduction with repeat orders, but closing conditions remained and customer names,
      accepted production tools, throughput, yield and uptime were not disclosed.
    evidence: vendor
    as_of: 2026-10-15
    source_ids:
      - naura-nuohe-jianwei-acquisition-2026-10-16
  - label: First-half commercial scale
    value: Company reported RMB 20.161 billion of first-half revenue, up 24.90% year over year,
      and RMB 2.677 billion of R&D expense, up 28.87%.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - naura-2026-h1-report
  - label: Advanced packaging expansion
    value: Company reports that hybrid-bonding and high-end TSV electroplating tools were rolled out;
      the filing does not disclose named-customer acceptance, yield or production volume.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - naura-2026-h1-report
  - label: Atomic-layer-etch customer use
    value: Company says its ALE tool has achieved customer process use and an undated product disclosure
      says it entered a well-known customer's production line and completed process validation. The customer,
      process node, installed units, yield, uptime and production volume were not disclosed.
    evidence: vendor
    as_of: 2026-09-24
    source_ids:
      - naura-ale-primary
      - naura-ale-2026-09-24
  - label: Near-term delivery constraint
    value: Company says tight delivery of materials from individual suppliers may pressure some order
      deliveries over the next three to six months; affected components, suppliers and order value were not disclosed.
    evidence: vendor
    as_of: 2026-09-24
    source_ids:
      - naura-ale-2026-09-24
watch_for:
  - Customer-qualified replacement tools
  - Installed base and service revenue
  - Production yield at advanced nodes
