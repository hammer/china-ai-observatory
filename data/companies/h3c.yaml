name: H3C
chinese_name: 新华三
counterparts:
  - NVIDIA networking
  - Cisco
  - Arista
priority: 2
stage: Commercial
role: Data-center network and system supplier.
assessment: Open interconnect work, a reported customer deployment and a specified 40-card scale-up
  system are meaningful integration signals, but do not establish domestic provenance for all silicon,
  production deployment or workload parity with InfiniBand and NVLink systems.
key_fact:
  label: Deployment evidence
  value: H3C reports a deployed DDC lossless-network project with Xiaohongshu and participation in
    G-Link and ODCC standards work; no matched InfiniBand workload result was disclosed.
  evidence: primary
  as_of: 2026-09-04
  source_ids:
    - h3c-odx-2026-09-04
facts:
  - label: Open scale-up direction
    value: H3C describes UXM module support, G-Link development and NPO/CPO interfaces with
      112G/224G compatibility and a reserved 448G SerDes path.
    evidence: primary
    as_of: 2026-09-04
    source_ids:
      - h3c-odx-2026-09-04
  - label: Domestic-accelerator supernode
    value: H3C says UniPoD S81000 X1 supports 40 unnamed domestic accelerators in one scale-up
      domain, 448 GB/s peer-to-peer bandwidth, 5,760 GB of unified-address memory and up to
      28 PFLOP/s FP8. Accelerator and switch silicon, dense-versus-sparse convention, power,
      deployment and workload results were not disclosed.
    evidence: vendor
    as_of: 2026-09-29
    source_ids:
      - h3c-unipod-s81000-x1-2026-09-29
  - label: NPO interface standardization
    value: H3C reports co-authoring an OPEN NPO electrical-connector specification covering 6.4T/7.2T optical-engine
      interfaces and a 224G AI Rack interconnect report. It also claims multi-vendor 224G interoperability with
      1.6T OSFP modules and DAC cables; no public test harness, error-rate or power results were provided.
    evidence: vendor
    as_of: '2026-10-28'
    source_ids:
    - h3c-npo-standard-2026-10-28
  - label: Named university deployment
    value: H3C describes a 77-node GPU cluster at Tsinghua Shenzhen International Graduate School using R5300
      servers, 200G RoCE, X20000 storage and Kubernetes-based Lingxi management. Its thousand-card framing is
      not an exact installed-card count; GPU models, domestic origin and independently measured operating results
      remain undisclosed.
    evidence: vendor
    as_of: '2026-10-27'
    source_ids:
    - h3c-tsinghua-sig-2026-10-27
watch_for:
  - RDMA behavior under congestion
  - Switch and NIC silicon provenance
  - Large-cluster collective performance
