role: An important domestic etch-equipment supplier.
assessment: AMEC's half-year report provides production-line, customer-validation and repeat-order
  evidence across etch and tungsten deposition. It does not name customers or disclose advanced-node
  yield, uptime, throughput, installed capacity or complete-process independence.
key_fact:
  label: Etch deployment scale
  value: Company reports three ICP etch product families in volume production on lines at more than 50 customers
  evidence: vendor
  as_of: 2026-06-30
  source_ids:
    - amec-2026-h1-report
facts:
  - label: Advanced etch production
    value: Company reports Primo Nanova LUX-Cryo in stable volume production on a customer's
      next-generation product line, while Primo Angnova remained in customer certification with
      multiple repeat orders.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - amec-2026-h1-report
  - label: Tungsten deposition qualification
    value: Company reports its tungsten CVD, high-aspect-ratio CVD and ALD series passed onsite
      validation at key memory and logic customers and received repeat production orders; customers
      and production metrics were not disclosed.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - amec-2026-h1-report
  - label: CSEAC 2026 tool launches
    value: Six announced tools span very-high-aspect-ratio etch, PECVD, ALD, metal-film
      deposition and silicon-carbide epitaxy; customer qualification remains unverified.
    evidence: reported
    as_of: 2026-09-01
    source_ids:
      - amec-cseac-2026-09-05
