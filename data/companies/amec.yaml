name: AMEC
chinese_name: 中微公司
counterparts:
  - Lam Research
  - Applied Materials
priority: 1
stage: Commercial
role: An important domestic etch-equipment supplier.
assessment: AMEC's half-year report provides production-line, customer-validation and repeat-order
  evidence across etch and tungsten deposition. It does not name customers or disclose advanced-node
  yield, uptime, throughput, installed capacity or complete-process independence. Its proposed
  investment in Qinghe Jingyuan supports an advanced-packaging-equipment supplier but is not evidence
  that bonding tools have completed customer qualification or entered volume production. Reported
  product and installed-base figures from the 2026 Guoxin Expo strengthen scale evidence but do not
  identify production nodes, tool utilization, acceptance criteria or customer economics.
key_fact:
  label: Etch deployment scale
  value: Company reports three ICP etch product families in volume production on lines at more than 50 customers
  evidence: vendor
  as_of: 2026-06-30
  source_ids:
    - amec-2026-h1-report
facts:
  - label: Reported installed reaction-chamber scale
    value: China Star Market reported that AMEC had more than 8,800 cumulative reaction chambers
      operating in over 220 domestic and overseas production lines at more than 100 customers by
      June 2026. The report did not name customers or disclose product mix, nodes, utilization,
      uptime, yield contribution or repeat-order economics.
    evidence: reported
    as_of: 2026-06-30
    source_ids:
      - guoxin-expo-2026-10-12
  - label: Advanced-memory tool launches
    value: AMEC displayed its newly launched Primo XD-RIE 70-to-90:1 aspect-ratio etch system and
      Prefima Unicore AM 300 mm molybdenum ALD system. Announced capabilities were not accompanied
      by named-customer qualification, accepted deliveries, production use or operating metrics.
    evidence: reported
    as_of: 2026-10-12
    source_ids:
      - guoxin-expo-2026-10-12
  - label: Reported foreign-fab evaluation
    value: Reuters reported Samsung and SK Hynix had evaluated AMEC etch tools at their Chinese fabs,
      while both companies denied testing AMEC equipment for use in China and no deployment decision was reported.
    evidence: reported
    as_of: 2026-08-05
    source_ids:
      - amec-evaluation-reuters-2026-08-05
  - label: Advanced etch production
    value: Company reports Primo Nanova LUX-Cryo in stable volume production on a customer's
      next-generation product line, while Primo Angnova remained in customer certification with
      multiple repeat orders.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - amec-2026-h1-report
  - label: Tungsten deposition qualification
    value: Company reports its tungsten CVD, high-aspect-ratio CVD and ALD series passed onsite
      validation at key memory and logic customers and received repeat production orders; customers
      and production metrics were not disclosed.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - amec-2026-h1-report
  - label: CSEAC 2026 tool launches
    value: Six announced tools span very-high-aspect-ratio etch, PECVD, ALD, metal-film
      deposition and silicon-carbide epitaxy; customer qualification remains unverified.
    evidence: reported
    as_of: 2026-09-01
    source_ids:
      - amec-cseac-2026-09-05
  - label: Advanced bonding-equipment investment
    value: AMEC approved up to RMB 35 million of additional investment in Qinghe Jingyuan as part
      of a RMB 250 million round intended partly for hybrid-bonding and atomic-beam equipment;
      the agreement remained unsigned and production qualification was undisclosed.
    evidence: primary
    as_of: 2026-10-09
    source_ids:
      - amec-qinghe-jingyuan-investment-2026-10-13
  - label: September production footprint
    value: The unaudited quarterly filing reports more than 9,300 cumulative reaction chambers in volume-production
      lines domestically and overseas by September 30. Nine-month revenue was RMB 10.326 billion; attributable
      profit excluding non-recurring items was RMB 1.623 billion. Product mix, named customers, nodes, utilization
      and yield contribution remain undisclosed.
    evidence: vendor
    as_of: '2026-09-30'
    source_ids:
    - amec-q3-2026-10-31
  - label: Etch operating-stage distinction
    value: Company reports its 60:1 etcher in volume production with uptime above 90%; the measurement period,
      fleet and method are undisclosed. Its 90:1 successor remains in customer validation. Primo Angnova
      reportedly achieved 140:1 etching and shipped for certification, not demonstrated qualified volume
      production.
    evidence: vendor
    as_of: '2026-11-02'
    source_ids:
    - amec-ir-2026-11-02
  - label: Tungsten deposition shipments
    value: Company reports more than 500 cumulative reaction stations shipped across CVD-W, HAR-W and ALD-W
      products. This is not a count of complete tools or independently accepted installations.
    evidence: vendor
    as_of: '2026-11-02'
    source_ids:
    - amec-ir-2026-11-02
  - label: Memory demand and parts supply
    value: Company says NAND and DRAM represented about 60% of nine-month orders, while component shortages
      challenge delivery. Domestic-supplier development and capacity expansion are mitigation efforts, not
      proof of a fully domestic bill of materials.
    evidence: vendor
    as_of: '2026-11-02'
    source_ids:
    - amec-ir-2026-11-02
watch_for:
  - Advanced-process customer qualifications
  - Repeat orders and production utilization
  - Signed Qinghe Jingyuan financing and independently verified bonding-tool customer acceptance
  - Customer qualification and production metrics for XD-RIE and Unicore AM
