name: AMEC
chinese_name: 中微公司
counterparts:
  - Lam Research
  - Applied Materials
priority: 1
stage: Commercial
role: An important domestic etch-equipment supplier.
assessment: AMEC's half-year report provides production-line, customer-validation and repeat-order
  evidence across etch and tungsten deposition. It does not name customers or disclose advanced-node
  yield, uptime, throughput, installed capacity or complete-process independence. Its proposed
  investment in Qinghe Jingyuan supports an advanced-packaging-equipment supplier but is not evidence
  that bonding tools have completed customer qualification or entered volume production.
key_fact:
  label: Etch deployment scale
  value: Company reports three ICP etch product families in volume production on lines at more than 50 customers
  evidence: vendor
  as_of: 2026-06-30
  source_ids:
    - amec-2026-h1-report
facts:
  - label: Reported foreign-fab evaluation
    value: Reuters reported Samsung and SK Hynix had evaluated AMEC etch tools at their Chinese fabs,
      while both companies denied testing AMEC equipment for use in China and no deployment decision was reported.
    evidence: reported
    as_of: 2026-08-05
    source_ids:
      - amec-evaluation-reuters-2026-08-05
  - label: Advanced etch production
    value: Company reports Primo Nanova LUX-Cryo in stable volume production on a customer's
      next-generation product line, while Primo Angnova remained in customer certification with
      multiple repeat orders.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - amec-2026-h1-report
  - label: Tungsten deposition qualification
    value: Company reports its tungsten CVD, high-aspect-ratio CVD and ALD series passed onsite
      validation at key memory and logic customers and received repeat production orders; customers
      and production metrics were not disclosed.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - amec-2026-h1-report
  - label: CSEAC 2026 tool launches
    value: Six announced tools span very-high-aspect-ratio etch, PECVD, ALD, metal-film
      deposition and silicon-carbide epitaxy; customer qualification remains unverified.
    evidence: reported
    as_of: 2026-09-01
    source_ids:
      - amec-cseac-2026-09-05
  - label: Advanced bonding-equipment investment
    value: AMEC approved up to RMB 35 million of additional investment in Qinghe Jingyuan as part
      of a RMB 250 million round intended partly for hybrid-bonding and atomic-beam equipment;
      the agreement remained unsigned and production qualification was undisclosed.
    evidence: primary
    as_of: 2026-10-09
    source_ids:
      - amec-qinghe-jingyuan-investment-2026-10-13
watch_for:
  - Advanced-process customer qualifications
  - Repeat orders and production utilization
  - Signed Qinghe Jingyuan financing and independently verified bonding-tool customer acceptance
