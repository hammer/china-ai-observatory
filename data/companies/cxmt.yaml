name: CXMT
chinese_name: 长鑫存储
counterparts:
  - SK hynix
  - Samsung
  - Micron
priority: 1
stage: Scaling
role: China’s principal DRAM and HBM company to watch.
assessment: >-
  Fifth-generation commodity DRAM and LPDDR6 are company-reported in mass production, with Xiaomi
  providing a named LPDDR6 handset design-in. Adequate domestic HBM volume and frontier HBM performance
  remain separate milestones. Proposed post-IPO research and back-end-testing projects would expand
  vertical integration, but approved funding is not completed capacity. The reported NAND project is
  an R&D-line plan, not evidence of qualified commercial output. An unaudited nine-month forecast
  reports a sharp revenue increase and profit turnaround amid higher DRAM prices and utilization,
  strengthening commercial-scale evidence without disclosing unit volume, yield or product mix.
  Its announced 4F2 VSG roadmap targets a server DDR5 RDIMM by year-end 2026, but no completed
  product, qualification, capacity, speed or density was disclosed.
key_fact:
  label: HBM milestone
  value: Small-volume HBM3E reportedly produced in August 2026
  evidence: reported
  as_of: 2026-08-31
  source_ids:
    - cxmt-hbm
    - cxmt-hbm-reuters-2026-08-31
    - cxmt
facts:
  - label: 4F2 server-memory roadmap
    value: CXMT said its first product using a self-developed vertical-surrounding-gate 4F2 cell
      architecture would be a DDR5 RDIMM expected by year-end 2026. The company described related
      word-line, bit-line and junction-process work, but disclosed no completed product, speed,
      capacity, node, customer qualification or intended volume.
    evidence: reported
    as_of: 2026-10-10
    source_ids:
      - cxmt-4f2-rdimm-2026-10-11
  - label: Nine-month earnings forecast
    value: CXMT forecast January-September revenue of RMB 265.0-270.0 billion and attributable net
      profit of RMB 131.0-132.5 billion, compared with RMB 32.084 billion of revenue and a RMB 5.280
      billion loss a year earlier. The figures were preliminary and unaudited.
    evidence: primary
    as_of: 2026-09-30
    source_ids:
      - cxmt-nine-month-forecast-2026-10-17
  - label: LPDDR6 commercial design-in
    value: CXMT and Xiaomi said CXMT's LPDDR6 entered mass production for the Xiaomi 18 Fold. CXMT
      reports a 16 Gb die, 16 GB package and up to 12,800 Mbps; bandwidth and power comparisons are
      internal tests, while volume, yield, reliability at scale and fabrication provenance are undisclosed.
    evidence: reported
    as_of: 2026-08-29
    source_ids:
      - cxmt-lpddr6-primary-2026-09-07
      - cxmt-lpddr6-reuters-2026-08-29
  - label: Capacity expansion
    value: Reuters reported two new plants under construction and discussions for a third, with projects
      projected to lift capacity above 600,000 wafers per month; completion, qualification and realized output remain unverified.
    evidence: reported
    as_of: 2026-07-24
    source_ids:
      - china-memory-expansion-reuters-2026-07-24
  - label: Fifth-generation DRAM platform
    value: CXMT says its fifth-generation platform entered mass production using quadruple patterning
      and an 11.95 nm active-area half-pitch; independent yield and reliability data were not disclosed.
    evidence: reported
    as_of: 2026-09-20
    source_ids:
      - cxmt-g5-dram-2026-09-20
  - label: LPDDR5X production
    value: Two 24 Gb LPDDR5X products are company-reported in mass production, with at least 50% more
      gross dies per wafer than the fourth-generation platform on an 8 Gb baseline; gross dies are
      potential dies before defective units are excluded, not tested yield.
    evidence: reported
    as_of: 2026-09-20
    source_ids:
      - cxmt-g5-dram-2026-09-20
  - label: NAND expansion plan
    value: Reuters reports CXMT plans a Beijing NAND R&D production line and has discussed prospective
      AI-storage customers; no operating date or commercial-production commitment was established.
    evidence: reported
    as_of: 2026-09-18
    source_ids:
      - cxmt-nand-2026-09-18
  - label: Proposed research and testing investment
    value: CXMT's board proposed using RMB 13.0 billion of over-raised IPO funds for a technology-
      research project and RMB 5.0 billion for a second-phase DRAM wafer back-end testing base;
      shareholder approval, construction, installed capacity and qualified output remained pending.
    evidence: primary
    as_of: 2026-09-28
    source_ids:
      - cxmt-overfund-projects-2026-09-29
watch_for:
  - Customer-qualified HBM shipments
  - Stack yield and volume
  - Accelerators shipping with verified domestic DRAM
  - Independent G5 yield, reliability and customer qualification
  - Named domestic-equipment contributions to the G5 process flow
  - NAND trial-line operation and transition to qualified volume production
  - LPDDR6 shipment volume, yield and additional customer qualification
  - Shareholder approval, construction and operating milestones for the research and testing projects
  - Launch, independent validation and server qualification of the planned 4F2 DDR5 RDIMM
