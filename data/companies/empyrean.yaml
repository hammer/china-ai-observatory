name: Empyrean
chinese_name: 华大九天
counterparts:
  - Synopsys
  - Cadence
  - Siemens EDA
priority: 2
stage: Commercial
role: Domestic EDA tools across analog, digital, and verification workflows.
assessment: >-
  Empyrean reports adoption in core design flows and several node-specific foundry certifications,
  but customer identities, tape-outs, sign-off correlation and the breadth of each certified flow
  remain undisclosed. A complete qualified digital design flow is a higher bar than replacing one tool.
key_fact:
  label: Coverage
  value: Growing design and verification portfolio
  evidence: vendor
  as_of: 2026-09-11
  source_ids:
    - empyrean
facts:
  - label: Proposed digital-logic EDA acquisition
    value: The October 30 board approved a proposed investment of up to RMB 220
      million to acquire no more than 51% of Qijie Technology (Shenzhen). The
      November 2 disclosure says the aim is to address digital-logic optimization
      gaps and develop next-generation AI/3DIC logic and performance optimization.
      Consolidation is conditional on completion; board approval does not
      establish a completed acquisition, integrated product flow or
      customer-qualified sign-off capability.
    evidence: primary
    as_of: 2026-10-30
    source_ids:
      - empyrean-qijie-board-2026-11-02
  - label: Customer-flow and foundry-certification claims
    value: Empyrean says products entered core design flows at leading domestic chip-design and
      manufacturing customers and supported mass production. It reports ALPS certification at
      8 nm, 5 nm and 4 nm, Patron at 14 nm, and Argus DRC/LVS at 28 nm; the filing does not name
      foundries, customers, tape-outs, covered rule decks, sign-off correlation or production volume.
    evidence: primary
    as_of: 2026-06-30
    source_ids:
      - empyrean-2026-h1-report
  - label: Proposed hardware-emulation investment
    value: On October 13 the board approved contributing RMB 150 million cash and its indirectly held 7.78%
      S2C stake to Wuxi Yake Hongyu as part of a proposed restructuring. Cash funding is conditional on
      the merger; the filing says the core hardware-emulation accelerator remains in R&D, with validation
      and commercialization uncertain. It does not establish transaction completion or a qualified complete
      digital flow.
    evidence: primary
    as_of: '2026-10-13'
    source_ids:
    - empyrean-yake-s2c-investment-2026-10-13
watch_for:
  - Complete-flow customer tape-outs
  - Frontier-node sign-off accuracy
  - Interoperability and productivity
