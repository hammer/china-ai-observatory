name: YMTC
chinese_name: 长江存储
counterparts:
  - Samsung
  - Kioxia
  - Micron
priority: 1
stage: Commercial
role: NAND and enterprise storage built around Xtacking.
assessment: NAND is storage, not a direct substitute for accelerator HBM. Planned fab expansion can
  increase domestic supply while reliance on foreign lithography and other fab equipment remains a
  sovereignty constraint.
key_fact:
  label: Technology
  value: Separate memory-cell and logic wafers, bonded together
  evidence: vendor
  as_of: 2026-09-11
  source_ids:
    - ymtc
facts:
  - label: Capacity expansion
    value: Reuters reported two additional factories planned beyond one due for completion in 2026;
      completed capacity, qualified output and domestic equipment provenance remain unverified.
    evidence: reported
    as_of: 2026-07-24
    source_ids:
      - china-memory-expansion-reuters-2026-07-24
  - label: Equipment diversification
    value: The Wire China reported that YMTC replaced blocked U.S. chipmaking tools with Dutch and
      Japanese equipment; suppliers, models, domestic share and complete-flow provenance were not
      disclosed.
    evidence: reported
    as_of: 2026-10-04
    source_ids:
      - ymtc-wire-china-2026-10-04
  - label: Licensed process IP
    value: The Wire China reported that at least one YMTC innovation was licensed to Samsung; the
      patent, terms, production use and economic contribution were not disclosed.
    evidence: reported
    as_of: 2026-10-04
    source_ids:
      - ymtc-wire-china-2026-10-04
  - label: Pricing and product mix
    value: The Wire China reportedly quoted one unnamed employee saying YMTC had raised chip prices,
      shifted production toward higher-margin products and expected the global memory shortage to
      last at least another three years. Affected products, price changes, capacity allocation and
      corporate guidance were not disclosed.
    evidence: reported
    as_of: 2026-10-04
    source_ids:
      - ymtc-wire-china-2026-10-04
      - ymtc-shortage-techradar-2026-10-06
watch_for:
  - NAND density and yield
  - Enterprise SSD qualifications
  - Equipment localization
