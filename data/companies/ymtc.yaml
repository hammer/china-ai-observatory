name: YMTC
chinese_name: 长江存储
counterparts:
  - Samsung
  - Kioxia
  - Micron
priority: 1
stage: Commercial
role: NAND and enterprise storage built around Xtacking.
assessment: >-
  YMTC has reached global commercial scale in NAND, but its shipment rank still exceeds its revenue
  rank because of a consumer-heavy product mix. NAND is storage, not a direct substitute for
  accelerator HBM. Proposed IPO financing and fab expansion can increase domestic supply while
  reliance on foreign lithography and other fab equipment remains a sovereignty constraint.
key_fact:
  label: Technology
  value: Separate memory-cell and logic wafers, bonded together
  evidence: vendor
  as_of: 2026-09-11
  source_ids:
    - ymtc
facts:
  - label: Capacity expansion
    value: Reuters reported two additional factories planned beyond one due for completion in 2026;
      completed capacity, qualified output and domestic equipment provenance remain unverified.
    evidence: reported
    as_of: 2026-07-24
    source_ids:
      - china-memory-expansion-reuters-2026-07-24
  - label: Equipment diversification
    value: The Wire China reported that YMTC replaced blocked U.S. chipmaking tools with Dutch and
      Japanese equipment; suppliers, models, domestic share and complete-flow provenance were not
      disclosed.
    evidence: reported
    as_of: 2026-10-04
    source_ids:
      - ymtc-wire-china-2026-10-04
  - label: Licensed process IP
    value: The Wire China reported that at least one YMTC innovation was licensed to Samsung; the
      patent, terms, production use and economic contribution were not disclosed.
    evidence: reported
    as_of: 2026-10-04
    source_ids:
      - ymtc-wire-china-2026-10-04
  - label: Pricing and product mix
    value: The Wire China reportedly quoted one unnamed employee saying YMTC had raised chip prices,
      shifted production toward higher-margin products and expected the global memory shortage to
      last at least another three years. Affected products, price changes, capacity allocation and
      corporate guidance were not disclosed.
    evidence: reported
    as_of: 2026-10-04
    source_ids:
      - ymtc-wire-china-2026-10-04
      - ymtc-shortage-techradar-2026-10-06
  - label: Global shipment scale
    value: Counterpoint estimated YMTC held 14% of global NAND shipment volume in the second quarter
      of 2026, ranking third, but ranked fifth by revenue because its mix remained concentrated in
      lower-priced consumer applications with a low enterprise-SSD share.
    evidence: measured
    as_of: 2026-06-30
    source_ids:
      - counterpoint-ymtc-q2-shipments-2026-08-12
  - label: Proposed STAR Market financing
    value: The Shanghai Stock Exchange accepted YMTC's application for a proposed RMB 33 billion
      STAR Market raise; the project was under inquiry and did not establish completed financing or
      installed capacity.
    evidence: primary
    as_of: 2026-08-21
    source_ids:
      - ymtc-star-market-ipo-2026-08-21
watch_for:
  - NAND density and yield
  - Enterprise SSD qualifications
  - Equipment localization
  - IPO approval, final proceeds and attributable capacity spending
