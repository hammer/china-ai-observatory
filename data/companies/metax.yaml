name: MetaX
chinese_name: 沐曦
counterparts:
  - NVIDIA
  - AMD
priority: 2
stage: Scaling
role: Chinese GPU compute contender.
assessment: >-
  MetaX reports broader model/framework support and unaudited nine-month profitability, alongside
  negative operating cash flow. Non-recurring gains materially affect reported profit. These financial
  and compatibility signals do not establish workload correctness, memory provenance or frontier parity.
  Its RLinf measurements remain vendor evidence; upstream integration is not independent reproduction.
key_fact:
  label: Research status
  value: Named commercial supplier; comparable independent benchmark still needed
  evidence: reported
  as_of: 2026-09-11
  source_ids:
    - hbm-reuters
facts:
  - label: Reported nine-month results
    value: Unaudited revenue was RMB 2.824 billion and attributable profit RMB 638.977 million;
      profit excluding non-recurring items was RMB 259.421 million. Operating cash outflow was
      RMB 1.338 billion. These figures cover January–September, not the third quarter alone.
    evidence: primary
    as_of: '2026-09-30'
    source_ids:
      - metax-q3-2026-10-31
  - label: RLinf upstream integration
    value: Merged PR 1656 adds MACA support. Author-reported tests used eight C550 GPUs on the original
      submission; subsequent fixes were not rerun on MetaX hardware. ManiSkill uses CPU physics, and no
      MetaX CI job was wired in.
    evidence: primary
    as_of: '2026-11-02'
    source_ids:
    - rlinf-metax-upstream-pr-1656
  - label: Embodied-model training disclosure
    value: MetaX reports Pi0.5/RoboTwin SFT on 1,024 C-series GPUs (128 eight-card nodes), with 20,000 steps
      completed in 32 hours. These are vendor measurements without matched foreign-hardware time-to-quality
      or power controls.
    evidence: vendor
    as_of: '2026-10-26'
    source_ids:
    - metax-rlinf-validation-2026-10-26
  - label: Nine-month earnings forecast
    value: Company forecast January-September revenue of RMB 2.541-3.106 billion and attributable
      net profit of RMB 586.8-717.2 million, versus a RMB 345.5 million loss a year earlier. The
      figures were unaudited, and the filing said increased investment in supply-chain companies
      contributed to the profit turnaround.
    evidence: primary
    as_of: 2026-09-30
    source_ids:
      - metax-nine-month-forecast-2026-10-16
  - label: Software compatibility coverage
    value: MetaX reports 37 flagship-model Day-0 adaptations since December 2025 and full support
      for PyTorch 2.8's 2,410 GPU operators; no reproducible workload benchmark accompanied the claim.
    evidence: vendor
    as_of: 2026-09-14
    source_ids:
      - metax-atria-2026-09-14
watch_for:
  - Independent workload results
  - Product availability
  - Memory sourcing
