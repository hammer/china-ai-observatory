name: Huawei
chinese_name: 华为
counterparts:
  - NVIDIA
  - Google TPU
priority: 1
stage: Commercial
role: "The central full-stack contender: Ascend, Atlas, interconnects, and CANN."
assessment: >-
  Huawei reports meaningful system shipments, commercial Ascend 950 use and a named carrier
  deployment, while DeepSeek contributors have now published an inspectable Ascend 950 backend for
  TileLang. Huawei also says production cannot satisfy domestic demand and that Ascend draws on China's
  very limited advanced-semiconductor capacity, which still relies on DUV lithography. The disclosures
  do not supply independently verified utilization or matched workload performance, and Chinese design,
  software support and deployment do not establish independence in HBM or fabrication equipment.
key_fact:
  label: Next product gate
  value: "Ascend 950DT: expected Q4 2026"
  evidence: reported
  as_of: 2026-09-11
  source_ids:
    - ascend
    - hbm-reuters
facts:
  - label: Cross-border patent licensing
    value: Huawei and Qualcomm announced a multi-year cross-license spanning 5G, compute, AI and
      networking, plus Qualcomm's planned purchase of certain Huawei US patents. The transaction
      remains subject to regulatory approvals; terms, covered patents and their use in specific
      products were not disclosed, so it does not establish a hardware-supply dependency.
    evidence: primary
    as_of: 2026-10-05
    source_ids:
      - huawei-qualcomm-patent-license-2026-10-05
      - huawei-qualcomm-patent-license-reuters-2026-10-05
  - label: Independent Ascend 950DT trace analysis
    value: InferenceX examined a 16-rank DeepSeek V4 decode profile on Ascend 950DT and found working,
      optimized day-one inference with overlapped compute and communications. The article did not
      publish a same-harness numerical Ascend-versus-H200/B200 result and said that comparison was
      future work; its profiler images are attributed to SemiAnalysis and Huawei.
    evidence: measured
    as_of: 2026-06-09
    source_ids:
      - inferencex-ascend-950dt-deepseek-v4-2026-06-09
  - label: Ascend 950 cloud-service evidence
    value: Huawei announced its Ascend 950 cloud cluster service and scheduled Chinese commercial
      availability for September 30, claiming 40 days of stable training, recovery within 10 minutes
      and 20% higher token throughput than its prior compute generation. Configuration, model, quality,
      customer use and independent availability or performance confirmation were not disclosed.
    evidence: vendor
    as_of: 2026-09-18
    source_ids:
      - huawei-cloud-ascend-950-service-2026-09-18
  - label: Open-source Ascend 950 programming path
    value: DeepSeek contributors published TileLang's native Ascend 950 backend with code generation,
      scheduling, synchronization and kernel examples; Reuters reports related compute and communication
      libraries for a 128-chip Ascend 950 supernode. This is inspectable software evidence, not a matched
      workload result or proof of CUDA equivalence.
    evidence: primary
    as_of: 2026-09-30
    source_ids:
      - tilelang-ascend-950-2026-09-30
      - deepseek-huawei-tilelang-reuters-2026-09-30
  - label: Hi-ONE optical-interconnect readiness
    value: Huawei says its 7.2T Hi-ONE near-packaged-optics engine has mass-production capability;
      shipped volume, component provenance, yield, customer acceptance and independent reliability
      data were not disclosed.
    evidence: vendor
    as_of: 2026-09-17
    source_ids:
      - huawei-hi-one-2026-09-17
  - label: Atlas system development status
    value: Huawei says a 256,000-card Atlas 950 cluster is being deployed and a near-packaged-optics
      Atlas 960 system is under test; neither is a verified completed deployment or workload result.
    evidence: vendor
    as_of: 2026-09-17
    source_ids:
      - huawei-peerium-2026-09-17
  - label: Peerium interconnect design
    value: Huawei describes UnifiedBus as a common protocol across compute, memory, storage and
      networking, with unified memory addressing and nested parallelism; independent scaling data are absent.
    evidence: vendor
    as_of: 2026-09-17
    source_ids:
      - huawei-peerium-2026-09-17
  - label: Scientific-computing measurements
    value: A Pengcheng Laboratory preprint measured Ascend 910A/B/C on five scientific workloads;
      a tuned 910C quantum-simulation run took 11.4 seconds versus 14.3 seconds on A800, while vector-
      and memory-bound kernels remained constrained. This is not a model-training or inference result.
    evidence: measured
    as_of: 2026-07-22
    source_ids:
      - ascend-science-2026-07-22
  - label: Domestic supply constraint
    value: Huawei executives say it cannot produce enough AI computing equipment to meet Chinese demand,
      Ascend competes with smartphone chips for China's very limited advanced-semiconductor capacity,
      and China still relies on DUV while working toward EUV. No capacity, order, fulfillment, yield or
      equipment-provenance figures were disclosed.
    evidence: reported
    as_of: 2026-10-01
    source_ids:
      - huawei-connect-2026-09-17
      - huawei-advanced-capacity-reuters-2026-10-01
  - label: Ascend 950 commercialization claim
    value: Huawei materials say Ascend 950 systems entered commercial use; configurations, volume,
      customer acceptance and workload results were not disclosed.
    evidence: reported
    as_of: 2026-09-17
    source_ids:
      - huawei-connect-2026-09-17
  - label: Scale-up architecture roadmap
    value: Huawei says Peerium is intended to link up to one million processors and an Ascend 960
      supernode is planned for up to 4,096 processors; these are architecture targets, not measured results.
    evidence: reported
    as_of: 2026-09-17
    source_ids:
      - huawei-connect-2026-09-17
  - label: Reported supernode shipments
    value: Huawei says it shipped more than 1,000 supernodes to more than 370 customers; customer,
      configuration, utilization and workload details were not disclosed.
    evidence: reported
    as_of: 2026-09-17
    source_ids:
      - huawei-connect-2026-09-17
  - label: 2027 accelerator roadmap
    value: Huawei expects the 960DT in Q1 2027 and Ascend 960PR in Q3 2027; these are launch targets,
      not delivered-product evidence.
    evidence: reported
    as_of: 2026-09-17
    source_ids:
      - huawei-connect-2026-09-17
  - label: China Unicom deployment
    value: Huawei says China Unicom deployed Ascend compute at scale and a 384-NPU supernode, and
      is adapting Ascend 950 for Unicom Cloud; independent operating metrics were not disclosed.
    evidence: vendor
    as_of: 2026-09-10
    source_ids:
      - huawei-china-unicom-2026-09-10
  - label: PyTorch accelerator integration
    value: Huawei is a PyTorch Foundation Platinum member and co-chairs its Accelerator
      Integration Working Group; governance participation does not prove workload parity.
    evidence: primary
    as_of: 2026-09-09
    source_ids:
      - pytorch-china-2026-09-09
  - label: Atlas 350 / 950PR
    value: 112 GB HBM; 1.4 TB/s; 425 TFLOPS BF16; up to 600 W
    evidence: vendor
    as_of: 2026-09-11
    source_ids:
      - atlas350
watch_for:
  - Sustained time-to-quality on large training runs
  - Customer utilization and recovery statistics
  - 950DT deliveries and verified memory provenance
  - 960DT and 960PR delivery against the new 2027 launch targets
  - Capacity, order fulfillment and verified performance of commercial Ascend 950 systems
