name: Biren
chinese_name: 壁仞科技
counterparts:
  - NVIDIA
  - AMD
priority: 2
stage: Scaling
role: General-purpose GPU compute contender.
assessment: No verified latest-versus-latest performance ratio in the baseline research.
key_fact:
  label: Strategic role
  value: AI GPU hardware and systems
  evidence: vendor
  as_of: 2026-09-11
  source_ids:
    - biren
facts:
  - label: First-half 2026 commercialization
    value: Company reports RMB 1.236 billion revenue (up 1,997.6% year on year) and a
      RMB 377 million loss for the period in its September 7 half-year summary.
    evidence: vendor
    as_of: 2026-06-30
    source_ids:
      - biren-2026-h1
  - label: Model compatibility
    value: Reports functional and accuracy validation of GLM-5.3-Flash on Bili 166M
      using SGLang and BIRENSUPA; no matched hardware speedup established.
    evidence: vendor
    as_of: 2026-09-07
    source_ids:
      - biren-glm-2026-09-07
  - label: PyTorch backend
    value: Company says it released TorchSUPA, a PrivateUse1 backend plugin with
      common API, collective-communication, graph-capture and profiling support;
      no public code repository was identified in this review.
    evidence: vendor
    as_of: 2026-09-07
    source_ids:
      - biren-torchsupa-2026-09-07
  - label: Optical-interconnect research
    value: September 2 Shanghai University laboratory agreement includes planned
      AI-chip optical-interconnect and cooling research, not production qualification.
    evidence: vendor
    as_of: 2026-09-02
    source_ids:
      - biren-shanghai-lab-2026-09-10
  - label: Next-generation product validation
    value: >-
      Company says an unnamed new-generation product completed bring-up and entered post-silicon
      validation; customer sampling and volume production remain expected over coming quarters,
      subject to satisfactory validation and qualification.
    evidence: vendor
    as_of: 2026-10-08
    source_ids:
      - biren-placement-2026-10-08
  - label: Conditional October placement
    value: >-
      Proposed best-efforts placement of 130 million H shares at HK$31.08 each could raise an
      estimated HK$4.0197 billion net; 70% is allocated to supply-chain procurement, production
      readiness and commercialization, but the transaction had not completed.
    evidence: vendor
    as_of: 2026-10-08
    source_ids:
      - biren-placement-2026-10-08
