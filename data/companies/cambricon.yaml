  - Google TPU
priority: 1
stage: Commercial
role: MLU accelerators and NeuWare software.
assessment: >-
  Revenue growth supports commercialization, while inventories and prepayments increased sharply. Financial scale and upstream software participation do not establish customer utilization, replenishable HBM supply or matched frontier-workload performance.
key_fact:
  label: Current product
  value: 590; prospective 690 remains separate
  evidence: reported
  as_of: 2026-09-11
  source_ids:
    - hbm-reuters
    - cambricon
facts:
  - label: Reported China market share
    value: IDC data reported by Reuters put Cambricon at 5% of China's data-center AI-accelerator
      shipments in the first half of 2026; unit volume, product mix, customers and workloads were not disclosed.
    evidence: reported
    as_of: 2026-06-30
    source_ids:
      - china-ai-accelerator-share-reuters-2026-10-13
  - label: Upstream software participation
    value: PyTorch Foundation Platinum member with reported contributions spanning
      torch.compile, runtime, distributed computing, AMP, data loading and profiling.
    evidence: primary
    as_of: 2026-09-08
    source_ids:
      - pytorch-cambricon-2026-09-07
      - pytorch-china-2026-09-09
  - label: Q3 financial scale and working capital
    value: Unaudited Q3 revenue was RMB 3.531 billion and attributable profit RMB 1.404 billion. Operating
      cash flow was negative RMB 83.68 million for Q3, versus positive RMB 227.64 million for January-September.
      September-end inventories reached RMB 11.665 billion and prepayments RMB 3.044 billion, versus RMB
      4.944 billion and RMB 0.745 billion at year-end 2025. The report does not identify chip/HBM inventory
      mix, shipment counts or customer utilization.
    evidence: primary
    as_of: '2026-09-30'
    source_ids:
    - cambricon-q3-2026-report
