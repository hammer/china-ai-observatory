name: Alibaba T-Head
chinese_name: 阿里平头哥
counterparts:
  - Google TPU
  - AWS Trainium
priority: 2
stage: Commercial
role: Cloud-oriented silicon and model/hardware co-design.
assessment: T-Head reports broad shipment and customer deployment, but does not disclose the product
  mix, customer acceptance, utilization, workload performance, power, fabrication or memory provenance.
  Vendor performance multipliers still require a disclosed baseline and workload.
key_fact:
  label: Reported deployment scale
  value: More than 560,000 Zhenwu units shipped; over 400 external customers across 20 industries
  evidence: reported
  as_of: 2026-05-20
  source_ids:
    - m890
    - thead
facts:
  - label: M890 rack system
    value: Alibaba said the Panjiu AL128 packages 128 M890 accelerators in one rack and was available
      to Chinese enterprise customers through Bailian; operating and customer-acceptance data were not disclosed.
    evidence: reported
    as_of: 2026-05-20
    source_ids:
      - m890
  - label: Accelerator roadmap
    value: Alibaba targets Zhenwu V900 for Q3 2027 and J900 for Q3 2028; these are expected milestones,
      not delivered products, and the reported performance multipliers lack a disclosed workload.
    evidence: reported
    as_of: 2026-05-20
    source_ids:
      - m890
watch_for:
  - Measured cloud utilization
  - Independent model-serving economics
  - Memory and manufacturing provenance
  - Product mix, utilization and acceptance behind reported shipment counts
source_ids:
