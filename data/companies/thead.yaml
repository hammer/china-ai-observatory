name: Alibaba T-Head
chinese_name: 阿里平头哥
counterparts:
  - Google TPU
  - AWS Trainium
priority: 2
stage: Commercial
role: Cloud-oriented silicon and model/hardware co-design.
assessment: T-Head reports broad shipment and customer deployment and has accelerated the V900
  commercialization target, but does not disclose precision-specific workload performance, power,
  fabrication, memory provenance, customer acceptance or operating utilization. Vendor performance
  and cluster-scale claims still require disclosed baselines, topology and reproducible workloads.
key_fact:
  label: Reported deployment scale
  value: More than 560,000 Zhenwu units shipped; over 400 external customers across 20 industries
  evidence: reported
  as_of: 2026-05-20
  source_ids:
    - m890
    - thead
facts:
  - label: M890 rack system
    value: Alibaba said the Panjiu AL128 packages 128 M890 accelerators in one rack and was available
      to Chinese enterprise customers through Bailian; operating and customer-acceptance data were not disclosed.
    evidence: reported
    as_of: 2026-05-20
    source_ids:
      - m890
  - label: Accelerator roadmap
    value: Alibaba targets Zhenwu V900 for Q3 2027 and J900 for Q3 2028; these are expected milestones,
      not delivered products, and the reported performance multipliers lack a disclosed workload.
    evidence: reported
    as_of: 2026-05-20
    source_ids:
      - m890
  - label: V900 launch update
    value: Alibaba unveiled V900 and now targets mass production and commercial release in Q1 2027,
      earlier than its May Q3 2027 roadmap; it claims three times M890 performance and clusters of up
      to 500,000 chips without disclosing workload, precision, topology, power or operating results.
    evidence: reported
    as_of: 2026-09-22
    source_ids:
      - alibaba-v900-2026-09-22
watch_for:
  - Measured cloud utilization
  - Independent model-serving economics
  - Memory and manufacturing provenance
  - Product mix, utilization and acceptance behind reported shipment counts
  - V900 production, customer acceptance and reproducible cluster-scale workloads
source_ids:
