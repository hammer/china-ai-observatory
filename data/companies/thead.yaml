name: Alibaba T-Head
chinese_name: 阿里平头哥
counterparts:
  - Google TPU
  - AWS Trainium
priority: 2
stage: Commercial
role: Cloud-oriented silicon and model/hardware co-design.
assessment: T-Head reports broad shipment and customer deployment and has accelerated the V900
  commercialization target, but does not disclose precision-specific workload performance, power,
  fabrication, memory provenance, customer acceptance or operating utilization. Vendor performance
  and cluster-scale claims still require disclosed baselines, topology and reproducible workloads.
key_fact:
  label: Reported deployment scale
  value: More than 560,000 Zhenwu units shipped; over 400 external customers across 20 industries
  evidence: reported
  as_of: 2026-05-20
  source_ids:
    - m890
    - thead
facts:
  - label: Proposed separate listing
    value: Alibaba’s November 10 filing discloses T-Head’s September 11 confidential Hong Kong listing
      application. Exchange clearance to proceed with the spin-off is distinct from final listing
      approval. T-Head is expected to remain an Alibaba subsidiary; offering size, structure and
      ownership dilution were not finalized. Listing Committee approval, CSRC filing and final company
      decisions remain conditions, with no assured completion date.
    evidence: primary
    as_of: 2026-11-10
    source_ids:
      - thead-spinoff-2026-11-10
  - label: Reported China market share
    value: IDC data reported by Reuters put T-Head at 7% of China's data-center AI-accelerator
      shipments in the first half of 2026; unit volume, product mix, customers and workloads were not disclosed.
    evidence: reported
    as_of: 2026-06-30
    source_ids:
      - china-ai-accelerator-share-reuters-2026-10-13
  - label: M890 rack system
    value: Alibaba said the Panjiu AL128 packages 128 M890 accelerators in one rack and was available
      to Chinese enterprise customers through Bailian; operating and customer-acceptance data were not disclosed.
    evidence: reported
    as_of: 2026-05-20
    source_ids:
      - m890
  - label: Accelerator roadmap
    value: Alibaba targets Zhenwu V900 for Q3 2027 and J900 for Q3 2028; these are expected milestones,
      not delivered products, and the reported performance multipliers lack a disclosed workload.
    evidence: reported
    as_of: 2026-05-20
    source_ids:
      - m890
  - label: V900 launch update
    value: Alibaba unveiled V900 and now targets mass production and commercial release in Q1 2027,
      earlier than its May Q3 2027 roadmap; it claims three times M890 performance and clusters of up
      to 500,000 chips without disclosing workload, precision, topology, power or operating results.
    evidence: reported
    as_of: 2026-09-22
    source_ids:
      - alibaba-v900-2026-09-22
      - alibaba-v900-primary-2026-09-22
  - label: Supernode commercialization and supply
    value: Alibaba says M890 AI Supernodes began reaching commercial scale in the third quarter of
      2026, while medium- and long-term demand exceeds its supply capability and wider data-center
      supply-chain shortages constrain expansion. It did not disclose delivered configurations,
      customer acceptance, utilization, reliability, power or workload results.
    evidence: vendor
    as_of: 2026-09-22
    source_ids:
      - alibaba-v900-primary-2026-09-22
  - label: SAIL developer-access announcement
    value: Jiemian reported the July 18 WAIC announcement of SAIL developer access, including SDK, kernel-driver,
      profiling and debugging resources. This historical announcement is backfilled on November 9; source
      availability, licensing, release completeness and migration/performance claims were not independently
      verified.
    evidence: reported
    as_of: '2026-07-18'
    source_ids:
    - thead-sail-announcement-2026-07-18
watch_for:
  - Measured cloud utilization
  - Independent model-serving economics
  - Memory and manufacturing provenance
  - Product mix, utilization and acceptance behind reported shipment counts
  - V900 production, customer acceptance and reproducible cluster-scale workloads
