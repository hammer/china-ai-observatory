  - heading: Next evidence to watch
    body: >-
      Prioritize delivered Ascend 950, Atlas 950 and M890 configurations with customer utilization,
      recovery, power and workloads; confirmation of Ascend 950 cloud availability; V900 production
      qualification; customer-qualified domestic HBM with volume and yield; repeat orders and
      operating metrics for ALE, CMP and lithography equipment; current high-speed optical-component
      provenance; resolution of supplier-material constraints; and reproducible training
      time-to-quality or inference throughput, latency and energy results on matched current hardware.
    source_ids: []
