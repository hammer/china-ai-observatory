coverage_note: >-
  This complete edition covers September 1-30 from 30 canonical in-period events and their original
  sources. Systematic tracking began September 11, so the September 1-10 portion was reconstructed
  from the archive plus bounded English and Chinese gap searches across accelerators, software,
  memory, networking, optics, lithography, manufacturing equipment and capital. The archive and
  searches are not an exhaustive census of private deployments, unindexed Chinese disclosures,
  tenders, filings or individual benchmark artifacts. Customer acceptance, production volume, yield,
  utilization, reliability, power and component provenance remain unavailable for many claims.
