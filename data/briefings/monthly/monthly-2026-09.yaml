title: A broader domestic ecosystem, with concentrated dependencies
summary: September’s early evidence points toward expanding suppliers and continuing pressure at critical inputs.
sections:
  - heading: Market structure
    body: The emerging stack spans compute, manufacturing tools, memory, and networking. Companies with anchor
      customers have a route to deployment learning; dependence on one customer also narrows the evidence of
      broader competitiveness.
