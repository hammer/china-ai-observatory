coverage_note: Closed-period synthesis of selected public disclosures dated October 1-31, researched November
  1. The September 11 baseline predates this month, but daily searches were partial and are not an exhaustive
  industry census. NAURA and CXMT October filings added to the Observatory November 1 are included because
  they were public before month-end. Prior editions, corrections and forecasts are preserved; no company review
  dates advance for synthesis alone. Targeted English/Chinese gap searches and source rereads covered adoption,
  software, memory, tools, optics, financing and benchmarks. Reuters market-share reporting was read through
  its syndication after direct retrieval failed; DeepInfer was read at the pinned revision through GitHub;
  Spark-Audio abstract was read after HTML retrieval failed. Syndication is not independent corroboration.
  Broker claims of additional deployments and post-period commentary were not promoted to verified facts. Private
  deployments, unindexed tenders, customer acceptance, yield, utilization, power, recovery and domestic input
  provenance remain incomplete. Benchmark artifacts were not exhaustively rerun or audited. Complete denotes
  the closed reporting period, not complete evidence coverage.
