  - heading: Manufacturing evidence crossed intermediate gates, not the complete-flow test
    body: >-
      Reuters reported initial production of domestic immersion-DUV tools, while warning that the
      systems still required testing and were not proven for reliable high-volume production. AMEC's
      filing reported three ICP etch families in volume production on lines at more than 50 customers
      and repeat-order evidence for additional etch and tungsten-deposition systems. NAURA reported
      more than 1,000 cumulative deliveries in each of etch, PVD and vertical-furnace equipment, then
      said its atomic-layer-etch tool had entered customer process use. JCET reported XDFOI volume
      production and silicon-photonics-engine sample validation; Hwatsing shipped a panel-level CMP
      system to a production line. Reuters also reported disputed AMEC evaluations at Samsung and SK
      Hynix China fabs: both memory companies denied testing tools for China and no deployment decision
      was reported. Together these are meaningful qualification steps outside the hardest lithography
      and metrology layers, but not proof of a domestic advanced-node flow with sustained yield,
      throughput, uptime and serviceability.
    source_ids:
