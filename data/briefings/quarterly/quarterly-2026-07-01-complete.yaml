  - heading: Networking moved toward domestic fabrics without an InfiniBand-class comparison
    body: >-
      H3C reported a DDC lossless-network deployment with Xiaohongshu and work on G-Link, UXM, ODCC
      and open optical interfaces. Huawei added future scale-up targets and said its 7.2T Hi-ONE
      near-packaged-optics engine had mass-production capability. The disclosures support active
      domestic fabric and interconnect engineering, but provide no matched workload, congestion,
      recovery, topology, switch-silicon provenance, power or independent customer comparison against
      current InfiniBand or Ethernet systems. System aggregation may compensate for weaker individual
      devices, but the cost in hardware, energy and operational complexity remains unmeasured.
    source_ids:
      - h3c-odx-2026-09-04
      - huawei-hi-one-2026-09-17
      - huawei-peerium-2026-09-17
  - heading: Software evidence became more upstream and inspectable
    body: >-
      Cambricon joined the PyTorch Foundation at Platinum level and reported work across compilation,
      runtime and distributed computing; Huawei already held Platinum membership and co-chaired the
      Accelerator Integration Working Group. Biren announced a PrivateUse1 TorchSUPA backend, MetaX
      reported same-day model adaptation, and DeepSeek contributors published an inspectable native
      Ascend 950 backend for TileLang with code generation, scheduling, synchronization and kernel
      examples. The independent Ascend field study still documented source patches, disabled features
      and operational safeguards on an older 16-device system. The quarter therefore improved evidence
      for ecosystem participation and portability without proving CUDA-equivalent operator coverage,
      stability, developer productivity or performance.
    source_ids:
