  - heading: Memory expanded, but HBM remained the clearest system constraint
    body: >-
      Reuters reported that CXMT was building two plants and discussing a third, while YMTC had two
      additional factories planned beyond one due for completion in 2026. The same report said both
      companies relied on ASML DUV equipment. CXMT reportedly produced HBM3E in small quantities and
      planned expansion in 2027; it later reported fifth-generation commodity DRAM and two 24 Gb
      LPDDR5X products in mass production. Those developments strengthen the domestic memory base but
      do not establish customer-qualified HBM at useful volume, stack yield or frontier performance.
      Reuters separately reported HBM scarcity raising Chinese accelerator prices, while Huawei said
      it could not supply enough AI equipment to meet domestic demand. JCET's advanced-packaging
      progress helps one adjacent layer but does not disclose frontier accelerator-plus-HBM package
      yield, capacity or customer volume.
