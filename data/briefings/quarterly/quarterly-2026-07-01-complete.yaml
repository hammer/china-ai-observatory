title: System capability advanced faster than replenishable sovereignty
summary: >-
  China ended the quarter with stronger evidence at the design, software, system-integration and
  selected equipment layers: accelerators reached customers, large systems moved onto roadmaps,
  domestic tools crossed additional production and validation gates, and optical suppliers showed
  global scale. End-to-end sovereignty did not follow. HBM, advanced-fab capacity, foreign optical
  components, lithography and other upstream inputs remained constraints, while public evidence still
  lacked a matched current Chinese-versus-frontier training or inference result.
sections:
  - heading: The sovereignty map separates control, fabrication and replenishment
    body: >-
      Q3 strengthened the first of three distinct claims: Chinese companies increasingly control the
      design and software of commercially useful accelerators, systems, networking products and optical
      modules. Evidence for the second claim—domestic fabrication—also improved through initial
      immersion-DUV production, etch and deposition deployment, advanced-packaging production and
      customer process use, but usually without yield, throughput, uptime, node or component-provenance
      data. The third and strongest claim, a supply chain that can be replenished inside China after
      foreign inventory and service access disappear, remains unproven. Reported reliance on ASML DUV,
      restricted HBM, foreign optical DSPs and supplier materials shows why design ownership is not the
      same as production independence.
    source_ids:
      - duv-reuters
      - amec-2026-h1-report
      - naura-2026-h1-report
      - jcet-2026-h1-report
      - china-memory-expansion-reuters-2026-07-24
      - hbm-reuters
      - cioe-optics-2026-09-11
  - heading: Accelerators progressed through revenue, delivery and system aggregation
    body: >-
      Moore Threads reported RMB 1.736 billion of first-half revenue and full delivery of a RMB 660
      million KUAE cluster contract; Biren reported RMB 1.236 billion of revenue and unnamed batch
      deliveries; Enflame raised about RMB 6.12 billion; and Alibaba said M890 supernodes were reaching
      commercial scale. Huawei reported more than 1,000
      supernodes shipped to more than 370 customers, a named China Unicom deployment, and commercial
      use of Ascend 950 systems. Roadmaps then shifted the competitive unit from one chip toward racks
      and clusters: Huawei described future 4,096-processor supernodes and larger Peerium fabrics,
      Alibaba advanced V900's planned production to Q1 2027, and JD Cloud announced a planned
      100,000-card Moore Threads cluster. These are adoption and aggregation signals, not matched
      evidence for utilization, reliability, power, workload performance or supply-chain provenance.
    source_ids:
