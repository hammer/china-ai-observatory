coverage_note: >-
  This complete edition covers July 1-September 30 from 40 canonical in-period events and their
  sources. Systematic tracking began September 11, so July, August and September 1-10 were
  reconstructed from filings, the existing archive and bounded overlapping English and Chinese gap
  searches across accelerators, software, lithography, equipment, foundries, memory, packaging,
  networking, optics and capital. The reconstruction is not an exhaustive census of private
  deployments, unindexed Chinese disclosures, tenders, filings or individual benchmark artifacts.
  Customer acceptance, production volume, yield, utilization, reliability, power and component
  provenance remain unavailable for many claims.
