  - heading: Optical scale was a competitive strength with foreign-input and policy exposure
    body: >-
      Innolight completed a Hong Kong offering with estimated net proceeds of HKD 52.891 billion,
      while Ligent and RoboTechnik also raised or sought expansion capital. September reporting
      indicated rising 1.6T shipments at Innolight and Eoptolink, but said 800G remained the volume
      center and identified constrained 3 nm DSP supply plus Broadcom and Marvell dominance. A teardown
      of one Eoptolink 400G module directly identified a Marvell DSP and Analog Devices components;
      that sample cannot establish current 800G or 1.6T bills of materials. A proposed US federal
      procurement restriction naming Innolight and Eoptolink added market-access risk but was not
      enacted in the quarter. China can lead at the module and manufacturing-scale level while still
      depending on foreign semiconductor inputs.
