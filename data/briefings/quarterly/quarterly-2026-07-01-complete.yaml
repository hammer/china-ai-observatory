  - heading: Training and inference evidence remained below the frontier-comparison standard
    body: >-
      A Pengcheng Laboratory study supplied useful measured evidence on Ascend 910A, 910B and 910C.
      In one tuned quantum-simulation case, 910C completed the workload in 11.4 seconds versus 14.3
      seconds on NVIDIA A800 with cuQuantum; the paper also documented weaker vector and memory-bound
      behavior. This is scientific computing, implementations differ in some comparisons and the
      controls are export-limited A800/H800 rather than current frontier systems. The October 1 review
      found no matched current Chinese result against Rubin, GB300, MI355X, TPU v7 or OpenAI Jalapeño
      in MLPerf Training v6.0, MLPerf Inference v6.1 or InferenceX's published coverage. MLPerf results
      are standardized and submitter-run rather than automatically independent. Absence of a public
      result is not evidence that a system cannot run the workload; it is a limit on what can be claimed.
    source_ids:
      - ascend-science-2026-07-22
      - mlperf-training
      - mlperf-inference-6-1
      - inferencex
  - heading: Dated forecasts did not move
    body: >-
      No forecast horizon changes. Q3 strengthened the existing high-confidence view that optical
      modules and focused domestic inference can advance first, and the medium-confidence view that
      China can build more competitive aggregate accelerator systems in 2027-2030 by spending more
      hardware, power and engineering effort. Small-volume HBM3E, commodity-DRAM production and
      packaging progress did not establish useful customer-qualified domestic HBM volume, so the
      2027-2030 memory and packaging horizon remains. Initial DUV production and additional tool
      qualifications did not demonstrate scanner yield, overlay, throughput, uptime or a complete
      domestic advanced-node flow, leaving EUV and frontier fabrication the longest-duration gap into
      the 2030s. The quarter changed confidence in intermediate milestones, not the endpoint dates.
    source_ids:
      - cioe-optics-2026-09-11
      - huawei-connect-2026-09-17
      - cxmt-hbm-reuters-2026-08-31
      - cxmt-g5-dram-2026-09-20
      - jcet-2026-h1-report
      - duv-reuters
      - duv-ft
  - heading: Evidence that would change the assessment
    body: >-
      Prioritize customer-qualified domestic HBM with volume and stack-yield data; scanner and
      advanced-process evidence with sustained yield, overlay, throughput, uptime and maintenance;
      current accelerator-cluster training time-to-quality, inference throughput, latency and energy
      on matched models and hardware; delivered Atlas, V900 and other supernode configurations with
      utilization and recovery data; high-speed optical-module bills of materials; and repeat orders
      plus production metrics for domestic etch, deposition, CMP, packaging and interconnect equipment.
    source_ids: []
