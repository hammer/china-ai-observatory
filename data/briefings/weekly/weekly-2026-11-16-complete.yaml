coverage_note: This closed-period edition covers four archived disclosures public November 16–22. The
  Alibaba transcript, CXMT original reporting, InnoLight filing and Kunlunxin announcement were reread
  on November 23. Supplemental English/Chinese searches checked accelerator, manufacturing and memory
  gaps. A Reuters search result concerning tighter TSMC access was found, but the full article could not
  be retrieved and its publication timing was not resolved; it remains a follow-up lead and is not treated
  as an established event here. Earlier filings backfilled during or after the week, including MetaX’s
  October results, are not relabeled as new in-period news. This synthesis is not a new comprehensive
  company sweep or benchmark-artifact audit, and no profile or benchmark review date advances. Daily coverage
  was partial; private deployments, tenders, unindexed disclosures, production yields, tool acceptance
  and component provenance remain incomplete. Complete denotes a closed calendar period, not exhaustive
  research. Earlier reports, corrections and dated forecasts are preserved.
