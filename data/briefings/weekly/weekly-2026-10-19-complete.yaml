coverage_note: This closed-period edition synthesizes eight canonical events published October 19–25 and
  supplemental English/Chinese cross-sector searches. Cambricon, ACM and Spark-Audio evidence was added
  to the Observatory on October 26 but was public within the covered week; the financial reporting period
  is earlier. Older filing backfills and previously recorded corrections are retained in the archive and
  are not relabeled as this week’s events. This briefing reviewed Huawei-related evidence, Cambricon,
  InnoLight, Eoptolink and ACM; it does not represent a new full-profile sweep. Search results were often
  stale or secondary. The original DeepSeek–Huawei article remains paywalled. Publication-day benchmark
  checks covered the MLPerf Training repository and InferenceX landing page; MLPerf Inference web retrieval
  failed, so its status relies on the separately recorded same-day GitHub check. Individual result artifacts
  were not exhaustively audited. Private deployments, unindexed disclosures, tenders, customer acceptance,
  production volume, yields, utilization, reliability, energy and component provenance remain incompletely
  covered. Complete describes the calendar period, not exhaustive research coverage.
