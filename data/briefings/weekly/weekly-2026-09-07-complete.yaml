coverage_note: >-
  The period begins four days before systematic coverage. This complete edition reconstructs
  September 7–13 from ten canonical events and overlapping English and Chinese searches; it is
  not an exhaustive census of filings, tenders, private customer deployments or benchmark artifacts.
  Several milestones are vendor disclosures, and missing customer, qualification and performance
  details remain explicit.
