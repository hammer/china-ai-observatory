coverage_note: >-
  This complete edition covers September 21-27 from four canonical in-period events, their original
  sources and bounded English and Chinese gap searches across accelerators, optical interconnects and
  capital, memory, networking and manufacturing equipment. Older or post-period public evidence is
  used only as clearly labeled context and is not included in news_ids. Coverage remains incomplete
  for private deployments, unindexed Chinese disclosures, tenders, individual benchmark artifacts and
  customer acceptance, production volume, yield, utilization, reliability, power and component
  provenance.
