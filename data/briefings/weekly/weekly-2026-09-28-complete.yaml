coverage_note: >-
  This complete edition covers September 28-October 4 from six canonical in-period events, their
  original sources and bounded English and Chinese gap searches across accelerators, software,
  networking and scale-up systems, lithography and fabrication capacity, manufacturing equipment,
  capital and benchmarks. Older or post-period evidence is not included in news_ids. Coverage
  remains incomplete for private deployments, unindexed Chinese disclosures, tenders, individual
  benchmark artifacts and customer acceptance, production volume, yield, utilization, reliability,
  power and component provenance. The reported Tencent transaction was not independently verified
  by Reuters.
