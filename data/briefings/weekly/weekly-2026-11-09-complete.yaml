coverage_note: This closed-period edition synthesizes four archive disclosures public November 9–15,
  covering SMEE, T-Head and SMIC. Original Alibaba and SMIC filings and attributed SMEE and SMIC
  reporting were reread. Supplemental English/Chinese searches checked manufacturing, accelerator
  and industry gaps without establishing a further qualifying milestone. Earlier disclosures added
  to the archive during the week are not relabeled as new in-period events. The November 16 daily
  sweep supplies explicitly post-period benchmark-check context; this briefing is not another full
  company-profile review. Daily coverage was partial, and a sparse event list does not imply a quiet
  industry. Private deployments, tenders, unindexed disclosures, qualified volumes, yields, acceptance,
  power, reliability and component provenance remain incompletely covered. Complete denotes the
  closed calendar period, not exhaustive research. Earlier editions, corrections, profile review dates
  and historical forecasts are preserved.
