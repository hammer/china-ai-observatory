coverage_note: >-
  This complete edition covers October 5-11 from four canonical in-period events, their original
  sources and the Observatory's daily overlapping English and Chinese searches across 16 priority
  and oldest-reviewed companies. No additional material in-period event was established. Older or
  post-period events are not included in news_ids. Coverage remains incomplete for private
  deployments, unindexed Chinese disclosures, tenders, individual benchmark artifacts and customer
  acceptance, production volume, yield, utilization, reliability, power and component provenance.
