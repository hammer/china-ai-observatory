coverage_note: >-
  This complete edition covers October 12-18 from six canonical disclosures published during the
  period, their original sources and the Observatory's daily overlapping English and Chinese
  searches across 16 priority and oldest-reviewed companies. The earnings and market-share events
  concern earlier reporting periods but became public during this week. A final cross-sector gap
  search established no additional material in-period event. Coverage remains incomplete for
  private deployments, unindexed Chinese disclosures, tenders, individual benchmark artifacts,
  customer acceptance, production volume, yield, utilization, reliability, power and component
  provenance.
