coverage_note: This closed-period edition selects eight consequential events public October 26–November
  1 from thirteen in-period archive records. It synthesizes CXMT, MetaX, Cambricon, JCET, NAURA, InnoLight
  and Eoptolink; it is not a new full-profile sweep. MetaX and CXMT sampling records were added November
  2 but concern public in-period disclosures. Their original texts were reviewed in the separately logged
  November 2 daily sweep; repeat retrieval during briefing preparation timed out or failed, so this synthesis
  relies on those same-day checks. Reuters HBM reporting was reread through its accessible relay, which
  is not independent corroboration. Financial statements cover earlier operating periods but were published
  during this week. Supplemental English/Chinese gap searches returned existing or older reporting; unresolved
  Iluvatar performance reporting and other conference leads are not promoted to benchmark evidence. The
  changing RLinf pull-request record is excluded from claims about period-end knowledge. Publication-day
  benchmark checks are explicitly post-period and not exhaustive. Private deployments, tenders, unindexed
  disclosures, customer acceptance, qualified production volumes, yield, power, reliability and component
  provenance remain incompletely covered. Complete describes the calendar period, not exhaustive research
  coverage. All earlier reports and dated forecasts are retained.
