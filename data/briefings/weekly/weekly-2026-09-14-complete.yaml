coverage_note: >-
  This complete edition covers September 14-20 from six canonical in-period events, their original
  sources and bounded English and Chinese gap searches across accelerators, memory, optical
  interconnects, software and manufacturing equipment. Older public evidence is used only as
  background and is not included in news_ids. Coverage remains incomplete for private deployments,
  unindexed Chinese disclosures, tenders, individual benchmark artifacts and customer acceptance,
  yield, utilization, reliability and power data.
