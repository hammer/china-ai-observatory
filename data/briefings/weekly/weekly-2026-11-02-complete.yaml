coverage_note: This closed-period edition covers eight archive disclosures public November 2–8 and synthesizes
  AMEC, Hwatsing, Iluvatar, InnoLight and YMTC. It is not a new full-profile sweep. AMEC and InnoLight’s
  November 6 records were added on November 9 after reviewing their original documents; those documents
  were public during the covered week. Iluvatar’s shipment total and other operating disclosures describe
  earlier operating periods. Supplemental English and Chinese searches checked industry and accelerator-performance
  gaps without establishing a further qualifying milestone. Primary InnoLight and Tower documents and
  Hwatsing reporting were reread; AMEC’s original investor record was reviewed in today’s separately logged
  daily sweep. Direct Reuters pages were unavailable, so indexed Reuters reporting and accessible Reuters
  relays were used; relays are not independent corroboration. Iluvatar’s original exchange filing and
  a reproducible package for additional reported performance claims remain unresolved. Publication-day
  benchmark checks are explicitly post-period and do not reconstruct period-end leaderboard contents.
  Private deployments, tenders, unindexed disclosures, customer acceptance, qualified volumes, yields,
  power, reliability and component provenance remain incompletely covered. Complete describes the closed
  calendar period, not exhaustive research coverage. Earlier editions, corrections, profile review dates
  and dated forecasts are preserved.
